<body>
<div class="scr" id="v-reg" data-scr="reg"></div>
<div class="scr" id="v-wai" data-scr="wai" hidden></div>
<div class="scr" id="v-kit" data-scr="kit" hidden></div>
<script>
const ROOM={tables:[[1,1,3],[2,1,3],[3,1,3],[1,2,3],[2,2,3],[3,2,3],[1,3,3],[2,3,3],[3,3,3],[1,4,3],[2,4,3],[3,4,3],[1,5,3],[2,5,3],[3,5,3],
  [2,6,3],[3,6,3],[2,7,3],[3,7,3],[2,8,3],[3,8,3],[2,9,3],[3,9,3],[2,10,3],[3,10,3],[2,11,3],[3,11,3],[2,12,3],[3,12,3]],
  blocks:[["キッチン",1,8,5]]};
function numberSeats(tables){let k=0;return tables.map((t,i)=>({i,c:t[0],r:t[1],n:t[2]})).sort((a,b)=>a.r-b.r||a.c-b.c)
  .map(t=>({...t,seats:Array.from({length:t.n},()=>String(++k))})).sort((a,b)=>a.i-b.i);}
const TB=numberSeats(ROOM.tables);
const SEATS=TB.flatMap(t=>t.seats).sort((a,b)=>a-b);
const ORD=Object.fromEntries(SEATS.map((n,i)=>[n,i]));
const PAMPH=500,PAMPH2=800;
// パンフレット：2冊ごとに800円、余った1冊は500円（1冊500・2冊800・3冊1,300・4冊1,600）
const pamphAmt=n=>Math.floor(n/2)*PAMPH2+(n%2)*PAMPH;
const DISCS=[["なし",0],["部員 −100円",100],["お詫び −300円",300],["無料",Infinity]];
const TABS=[["hist","履歴"],["sales","売上"],["close","締め"],["soldout","売り切れ"],["set","設定"]];
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const yen=v=>v.toLocaleString('ja-JP');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hhmm=d=>d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
const num=v=>{const n=parseInt(String(v).normalize('NFKC').replace(/[^\d]/g,''),10);return isNaN(n)?0:n;};
const CATN=["フード","ホットドリンク","スイーツ","アイスドリンク","オリジナルドリンク"];
// [品名, 値段, 持ち場(CATN の番号)]
const MENU=[["永遠の愛",400,4],["誰もが憧れるベリーソーダ",300,4],["自由を求めるクリームソーダ",400,4],["革命の歌 明日への希望を掲げて",400,4],
  ["コーヒー HOT",300,1],["コーヒー ICE",300,3],["紅茶 HOT",300,1],["紅茶 ICE",300,3],["ココア",300,1],["カフェラテ",300,1],
  ["オレンジジュース",300,3],["ホットサンド",500,0],["カレーライス",600,0],["マフィン",400,2],["クッキー",300,2]];
const MIN=60000;
const linesSum=L=>L.reduce((s,l)=>s+MENU[l.m][1]*l.q,0);
const HELP={
  reg:["席を押して選ぶ（まとめて何席でも選べる）","行の「− ＋」で数を直し、「足す」「移す」で注文を変える","値引きとパンフレットを選んで「会計済みにする」","間違えたら、下に出る「元に戻す」"],
  wai:["地図の席か一覧の行を押すと、席の中身が出る","「持っていく物」は、持っていったら「持ってった」を押す","席の中身の「作った」「持ってった」は、どちらからでも押せる","呼び出しは、行ったら「行った」を押す"],
  kit:["上から順に作る","1個作ったら、札を1枚押す（間違えたらもう一度）","赤い札は、待ちが長い物","運ぶときは、右（下）の欄の「持ってった」を押す"]
};
const helpHTML=k=>`<div class="ov"><div class="win hw"><div class="whead"><b>使い方</b><button data-a="hclose">✕</button></div><div class="hbody">${HELP[k].map(t=>`<p>${t}</p>`).join('')}</div></div></div>`;
const helpBtn=()=>`<button class="qbtn" data-a="help" aria-label="使い方">？</button>`;
const SCR=[['reg','レジ'],['wai','ウェイター'],['kit','キッチン']];
const swHTML=()=>`<span class="swb"><span class="sw">${SCR.map(([k,t])=>`<button class="${screen===k?'on':''}" data-a="go" data-v="${k}">${t}</button>`).join('')}</span><small>見本用</small></span>`;

// ---- 状態。st＝共有データ（元に戻す＝写しを戻す）
let st, screen='reg', toast=null, toastTimer=null, nextTick=0, added=0, NEWQ=[];
const SC={};
const DATA=['S','sel','flags','H','nid','disc','pamph','calls'];
const snap=()=>JSON.stringify(DATA.reduce((o,k)=>(o[k]=st[k],o),{}));
const restore=d=>DATA.forEach(k=>{st[k]=d[k];});
function setToast(msg,s,nav,after){toast={msg,s,nav,after};clearTimeout(toastTimer);toastTimer=setTimeout(()=>{toast=null;render();},4500);}
function clearToast(){toast=null;clearTimeout(toastTimer);}
function render(){SC[screen].render();}

// ---- データの操作（3つの画面が同じ物を使う）
function mkLine(m,q,o){return {id:st.nid++,m,q,ot:Date.now(),made:0,sent:0,mt:0,fresh:0,...o};}
function lineOf(id){for(const n of SEATS){const l=st.S[n].lines.find(x=>x.id===id);if(l)return {n,l};}return null;}
const findLine=id=>{const o=lineOf(id);return o?o.l:null;};
function allLines(){const a=[];SEATS.forEach(n=>st.S[n].lines.forEach(l=>{if(l.q>0)a.push({n,l});}));return a;}
function rdyLines(){return allLines().filter(o=>o.l.made>o.l.sent).sort((x,y)=>x.l.mt-y.l.mt||x.l.id-y.l.id);}
function addOrder(n,m,q){
  const s=st.S[n],now=Date.now(),f=s.lines.find(l=>l.m===m&&l.made===0);
  if(f){f.q+=q;f.fresh=now+3000;}else s.lines.push(mkLine(m,q,{ot:now,fresh:now+3000}));
  s.st='unpaid';
}
function restoreLines(n,ls){
  if(st.S[n].st!=='unpaid')st.S[n]={st:'unpaid',lines:[]};
  const d=st.S[n].lines,now=Date.now();
  ls.forEach(l=>{const f=d.find(x=>x.m===l.m);
    if(f){f.q+=l.q;f.made+=l.q;f.sent+=l.q;}else d.push(mkLine(l.m,l.q,{made:l.q,sent:l.q,ot:now-20*MIN,mt:now-16*MIN}));});
}
function setQty(l,d){l.q=Math.max(0,l.q+d);l.made=Math.min(l.made,l.q);l.sent=Math.min(l.sent,l.made);}
function moveSeat(from,to){
  st.S[to]=st.S[from];st.S[from]={st:'empty',lines:[]};
  st.sel=st.sel.map(x=>x===from?to:x);
  if(st.flags[from]){delete st.flags[from];st.flags[to]=true;}
  if(st.calls[from]){delete st.calls[from];st.calls[to]=true;}
}
// 2つの印。順番は強制しない（持ってったを押すと作ったも付く）
function toggleMade(l){if(l.made<l.q){l.made=l.q;l.mt=Date.now();}else{l.made=0;l.sent=0;}}
function toggleSent(l){if(l.sent<l.q){if(l.made<l.q){l.made=l.q;l.mt=Date.now();}l.sent=l.q;}else l.sent=0;}

function decorate(){
  const r2=rng(77),now=Date.now();
  const U=SEATS.filter(n=>st.S[n].st==='unpaid');
  const all=[];U.forEach(n=>st.S[n].lines.forEach(l=>all.push({n,l})));
  all.forEach(({l})=>{l.made=l.q;l.sent=l.q;l.ot=now-(15+r2()*40)*MIN;l.mt=l.ot+4*MIN;l.fresh=0;});
  const sh=a=>a.map(x=>[r2(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
  const S1=sh(all),seen=new Set(),pu=[];
  S1.forEach(o=>{if(!seen.has(o.l.m)){seen.add(o.l.m);pu.push(o);}});
  pu.forEach(o=>{o.l.q=1;});
  let extra=21-pu.length;
  for(let i=0;extra>0;i++,extra--)pu[3+i%(pu.length-3)].l.q++;
  const late=[11.6,10.9,10.3];
  pu.forEach((o,i)=>{o.l.made=0;o.l.sent=0;o.l.mt=0;o.l.ot=now-(i<3?late[i]:0.4+r2()*8.8)*MIN;});
  const part=pu.slice(3).find(o=>o.l.q===2);
  part.l.made=1;part.l.mt=now-3*MIN;
  const used=new Set(pu.map(o=>o.l.id)),seats=new Set([part.n]),qs=[1,1,1,2];let k=0;
  S1.forEach(o=>{if(k<4&&!used.has(o.l.id)&&!seats.has(o.n)){seats.add(o.n);o.l.q=qs[k++];o.l.made=o.l.q;o.l.sent=0;o.l.mt=now-(2+r2()*7)*MIN;o.l.ot=o.l.mt-4*MIN;}});
  st.calls[part.n]=true;st.calls[U.find((n,i)=>i>=10&&n!==part.n)]=true;
  const it=[4,11,0,13,5,9,12,1],iq=[1,1,2,1,1,1,1,1];
  NEWQ=it.map((m,i)=>[U[(i*5+2)%U.length],m,iq[i]]);
  nextTick=now+10000;added=0;
}
function tick(){
  if(added>=8)return;
  const [n,m,q]=NEWQ[added++];addOrder(n,m,q);
  setTimeout(render,3100);
}

// ---- 描画（作り直さず、変わった所だけ直す）
function morph(a,b){
  const ac=a.childNodes,bc=b.childNodes;
  for(let i=0;i<bc.length;i++){
    if(i>=ac.length){a.appendChild(bc[i].cloneNode(true));continue;}
    const x=ac[i],y=bc[i];
    if(x.nodeType!==y.nodeType||x.nodeName!==y.nodeName){x.replaceWith(y.cloneNode(true));continue;}
    if(x.nodeType===3){if(x.nodeValue!==y.nodeValue)x.nodeValue=y.nodeValue;continue;}
    for(const at of [...x.attributes])if(!y.hasAttribute(at.name))x.removeAttribute(at.name);
    for(const at of [...y.attributes])if(x.getAttribute(at.name)!==at.value)x.setAttribute(at.name,at.value);
    if(x.nodeName==='INPUT'&&document.activeElement!==x&&x.value!==y.getAttribute('value'))x.value=y.getAttribute('value')||'';

function seed(){

  const order=ROOM.tables.map((_,i)=>i).sort(()=>r()-.5),pOf={};
  order.forEach((ti,k)=>{pOf[ti]=k<14?.95:k<20?.55:.05;});
  TB.forEach((t,ti)=>{
    const fav=[pick(15),pick(15)];

      const x=r();let s='empty',lines=[];
      if(x<pOf[ti]){s='unpaid';const k=1+pick(3);
        for(let i=0;i<k;i++){const m=r()<.6?fav[pick(2)]:pick(15);const f=lines.find(l=>l.m===m);if(f)f.q++;else lines.push({m,q:r()<.15?2:1});}
      }else if(r()<(pOf[ti]>=.5?.5:.1))s='seated';

  });

}

 *  1. まだ作っていない行を、時刻の古い順に並べる
 *  2. いちばん古い行 L を取り、L と同じ品で L の時刻から W 分以内の行を全部まとめて1かたまり
 *  3. 残りで 2 を繰り返す

function buildGroups(todo,W){
  let rest=todo.slice().sort((a,b)=>a.at-b.at||a.id-b.id);
  const out=[];
  while(rest.length){

  if(!b||b.disabled){render();return;}
  const a=b.dataset.a;
  if(a==='go')go(b.dataset.v);else S.A[a](b.dataset.v);
  render();setTimeout(render,1900);
});
// 見本用：10秒ごとに新しい注文の行が1つ入る（合計8行まで）。取り消しの表示中は待つ
setInterval(()=>{const now=Date.now();if(!toast&&added<8&&now>=nextTick){tick();nextTick=now+10000;render();}},500);
setInterval(()=>{if(screen!=='reg')render();},5000);
seed();
SC.kit.enter();
Object.keys(SC).forEach(k=>{document.getElementById('v-'+k).hidden=k!==screen;});
render();
