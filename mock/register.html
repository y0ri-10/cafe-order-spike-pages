<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>レジ（見本）</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#fff}
body{height:100dvh;display:flex;flex-direction:column;color:#222;font-size:14px;
  font-family:-apple-system,"Hiragino Sans","Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
#root{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
[hidden]{display:none!important}
button{font:inherit;color:#222;cursor:pointer;margin:0;border:1px solid #ccc;background:#fff;border-radius:8px;padding:5px 10px;min-height:36px;line-height:1.2;white-space:nowrap}
button:active{opacity:.8}
button.on{background:#1d5fb8;border-color:#1d5fb8;color:#fff}
button:disabled{color:#bbb;border-color:#e3e3e3;background:#fff;cursor:default}
button.on:disabled{background:#bbb;border-color:#bbb;color:#fff}
button.danger{color:#d32f2f;border-color:#d32f2f}
button.danger:disabled{color:#bbb;border-color:#e3e3e3}
b{font-weight:700}
input{font:inherit;color:#222;min-height:36px;min-width:0;border:1px solid #ccc;border-radius:8px;padding:0 8px;background:#fff;text-align:right}
.num,.amt{font-variant-numeric:tabular-nums;white-space:nowrap}
.warn{color:#d32f2f}

/* 上の帯 */
.hwrap{position:relative;flex:none;z-index:6}
.hdr{display:flex;align-items:center;gap:10px;padding:6px 12px;border-bottom:1px solid #e3e3e3;min-height:46px;background:#fff}
.hdr .t{font-size:16px;font-weight:700}
.hdr .sum{color:#555;white-space:nowrap}
.hdr .sp{flex:1}
.hdr .fbtn{min-width:56px}
.hdr .fbtn.off{visibility:hidden}
.cband{position:absolute;left:0;right:0;top:100%;display:flex;align-items:center;gap:8px;padding:6px 12px;background:#fff;border-bottom:1px solid #ccc;min-height:46px}
.cband span{flex:1}

main{flex:1;min-height:0;display:grid;grid-template-columns:6fr 4fr}
.mapwrap{display:flex;flex-direction:column;min-height:0;min-width:0;padding:10px}
.maptop{flex:none;display:flex;align-items:center;gap:8px;margin-bottom:6px;height:38px}
.maptop .edge{flex:1;display:flex;justify-content:space-between;font-size:11px;color:#888}
.maptop .edge b{color:#555}
.maptop .mvbar{flex:1;display:flex;align-items:center;gap:8px;height:100%;padding:0 6px 0 12px;border:1px solid #1d5fb8;background:#e8f0fb;border-radius:8px;color:#12407f;font-weight:700}
.maptop .mvbar span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.maptop .mvbar button{min-height:30px}
.edge2{flex:none;display:flex;justify-content:flex-end;font-size:11px;color:#888;height:16px;line-height:16px}
#map{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:minmax(30px,1fr);gap:6px 16px;overflow:auto}
.kitchen{display:flex;align-items:center;justify-content:center;border:1px dashed #ccc;border-radius:8px;color:#bbb}
.table{grid-column:var(--c);grid-row:var(--r);display:flex;min-height:0}
.seats{flex:1;min-width:0;min-height:0;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px}
.seat{position:relative;padding:0;min-height:0;min-width:0;font-weight:700;font-size:17px;border-radius:6px}
.seat.empty{color:#888;border-color:#ccc}
.seat.seated{color:#bbb;border-color:#e3e3e3;font-weight:400}
.seat.unpaid{background:#e8f0fb;border-color:#1d5fb8;color:#12407f}
.seat.unpaid.on{background:#1d5fb8;color:#fff}
.seat i{position:absolute;top:0;right:3px;font-size:10px;font-style:normal;line-height:1.3}
.seat.dim{opacity:.3}
.seat.tgt{border:2px solid #1d5fb8;color:#12407f;background:#fff}

.pay{position:relative;display:flex;flex-direction:column;min-height:0;min-width:0;border-left:1px solid #e3e3e3;background:#fff}
.selbar{flex:none;display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid #e3e3e3;min-height:46px}
.selbar b{flex:1;font-size:15px}
.selbar b.none{color:#bbb}
.selbar button{min-width:44px;padding:0 10px}
.body{flex:1;min-height:0;overflow-y:auto;padding:8px 12px}
.hint{text-align:center;color:#bbb;font-weight:700;font-size:13px;margin:4px 0 8px}
.card{margin-bottom:12px}
.hd{display:flex;align-items:center;gap:6px;min-height:40px;border-bottom:1px solid #e3e3e3}
.hd .hn{flex:1;font-weight:700;font-size:15px}
.hd .flg{width:36px;padding:0}
.hd .amt{min-width:68px;text-align:right}
.hd button{min-height:32px;padding:3px 9px}
.line{display:flex;align-items:center;gap:8px;min-height:42px;border-bottom:1px solid #f0f0f0}
.line .nm{flex:1;min-width:0}
.line .amt{width:62px;text-align:right}
.line.z .nm,.line.z .amt,.line.z .q{color:#bbb}
.stp{display:inline-flex;align-items:center;gap:4px}
.stp button{width:34px;padding:0;min-height:32px;font-weight:700}
.stp b{min-width:22px;text-align:center}
.foot{position:relative;flex:none;padding:8px 12px 12px;border-top:1px solid #e3e3e3;background:#fff}
.drow{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:40px}
.drow .dbtn{min-width:120px;font-weight:700;text-align:center}
.dpop{position:absolute;right:0;bottom:100%;margin-bottom:4px;width:220px;display:flex;flex-direction:column;gap:6px;padding:8px;background:#fff;border:1px solid #ccc;border-radius:12px;z-index:3}
.dpop button{min-height:42px;font-weight:700}
.pamph{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:40px;margin-bottom:4px;border-top:1px solid #f0f0f0;padding-top:4px;font-weight:700}
.pamph .num{font-weight:400;color:#555;margin-left:6px}
.pamph .bulk{margin-left:0}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.total b{font-size:22px}
.main{width:100%;padding:13px;background:#1d5fb8;border-color:#1d5fb8;color:#fff;font-weight:700;font-size:15px}
.main:disabled{background:#bbb;border-color:#bbb;color:#fff}
.toast{position:absolute;left:12px;right:12px;bottom:100%;margin-bottom:6px;display:flex;align-items:center;gap:8px;background:#222;color:#fff;border-radius:8px;padding:6px 6px 6px 12px;z-index:2}
.toast span{flex:1}
.toast button{background:#fff;color:#1d5fb8;border-color:#fff;font-weight:700;min-height:32px}
.ar{display:flex;align-items:center;gap:8px;min-height:42px;border-bottom:1px solid #f0f0f0}
.ar .nm{flex:1;min-width:0}
.ar .p{width:44px;text-align:right;color:#555}
.ar.so .nm,.ar.so .p{color:#bbb}
.ar em{font-style:normal;color:#d32f2f;font-size:12px;font-weight:700;margin-left:4px}

/* メニューの窓 */
.ov{position:absolute;inset:0;background:rgba(0,0,0,.28);display:flex;padding:28px 40px;z-index:10}
.win{flex:1;min-width:0;display:flex;flex-direction:column;background:#fff;border:1px solid #ccc;border-radius:12px;overflow:hidden}
.whead{flex:none;display:flex;align-items:center;gap:8px;padding:6px 8px 6px 14px;border-bottom:1px solid #e3e3e3}
.whead b{flex:1;font-size:16px}
.whead button{width:48px;padding:0}
.wbody{flex:1;min-height:0;display:grid;grid-template-columns:150px 1fr}
.wlist{padding:10px;display:flex;flex-direction:column;gap:8px;border-right:1px solid #e3e3e3}
.wlist button{font-weight:700;min-height:44px}
.wcont{min-height:0;overflow-y:auto;padding:8px 14px}
.wtool{display:flex;justify-content:flex-end;padding-bottom:6px}
.hbtn{display:flex;width:100%;align-items:center;gap:10px;min-height:42px;margin-bottom:4px;text-align:left}
.hbtn.open{border-color:#1d5fb8}
.hbtn .ht{width:46px;color:#555}
.hbtn .hs{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.hbtn .hf{width:14px}
.hbtn .ha{font-weight:700;min-width:72px;text-align:right}
.hdet{padding:0 4px 8px}
.hdet .line{min-height:34px}
.hdet .line.act{border-bottom:0;justify-content:flex-end}
.hdet .line.tot{border-bottom:0;font-weight:700;justify-content:space-between}
.hdet .orig{text-align:right;font-size:12px;color:#777;margin:-2px 0 4px}
.hdet .line.act{margin-top:22px;padding-top:12px;border-top:1px solid #e3e3e3}
.hdet .dopts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;padding:4px 0 6px}
.hdet .dopts button{min-height:38px}
.hdet .dbtn2{min-width:120px;font-weight:700}
.fix{flex:none;font-size:11px;line-height:1.2;padding:2px 5px;border:1px solid #1d5fb8;color:#1d5fb8;border-radius:5px;background:#fff;white-space:nowrap}
.fcard{display:flex;gap:8px;align-items:baseline;padding:9px 0;border-bottom:1px solid #f0f0f0}
.fcard b{flex:1}
.fcard span{color:#555}
.srow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #f0f0f0;min-height:40px;gap:8px}
.srow.h{color:#555;font-size:13px;border:0;padding-top:14px}
.srow.it{padding:6px 0;min-height:34px}
.srow .s{flex:1}
.srow.so .s{color:#bbb}
.srow .tag{width:64px;color:#d32f2f;font-weight:700;font-size:13px;text-align:center}
.sob{width:84px;padding:3px 6px;min-height:32px;font-size:13px}
.fld{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.fld .l{flex:1}
.fld input{width:120px}
.blk{border:1px solid #e3e3e3;border-radius:10px;padding:8px 10px;margin-bottom:10px}
.bh{font-size:13px;color:#555;margin-bottom:4px}
.mvrow{display:flex;gap:6px;align-items:center;margin-top:6px}
.mvrow input{width:80px}
.mvrow input.memo{flex:1;text-align:left;width:auto}
.mvrow button{padding:0 10px;flex:none}
.note{color:#555;padding:12px 0}
.setbtn{display:block;width:100%;min-height:52px;font-size:16px;font-weight:700;text-align:left;padding:0 14px;margin-bottom:8px}

@media (max-width:700px){
  .hdr{padding:4px 8px;gap:5px;min-height:42px}
  .hdr .t{font-size:14px}
  .hdr .sum{font-size:11px}
  .hdr button{min-height:32px;padding:3px 7px;font-size:12px}
  .hdr .fbtn{min-width:0}
  .cband{padding:4px 8px}
  main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 52%}
  .pay{border-left:0;border-top:1px solid #e3e3e3}
  .mapwrap{padding:6px 8px}
  .maptop{height:34px;margin-bottom:4px}
  #map{grid-auto-rows:minmax(26px,1fr);gap:4px 10px}
  .seat{font-size:14px}
  .selbar{min-height:40px;padding:3px 12px}
  .body{padding:4px 12px}
  .hd{min-height:36px}
  .line{min-height:38px}
  .foot{padding:4px 12px 8px}
  .drow,.pamph{min-height:34px}
  .pamph{margin-bottom:2px;padding-top:2px}
  .drow button,.pamph .stp button{min-height:30px}
  .total{margin-bottom:4px}
  .total b{font-size:18px}
  .main{padding:10px}
  .ov{padding:10px}
  .wbody{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .wlist{flex-direction:row;border-right:0;border-bottom:1px solid #e3e3e3;padding:8px;gap:6px}
  .wlist button{flex:1;padding:3px 2px;font-size:13px;min-height:38px}
}
</style>
</head>
<body>
<div id="root"></div>
<script>
// ---- 部屋の配置（見本用）
const ROOM={tables:[[1,1,3],[2,1,3],[3,1,3],[1,2,3],[2,2,3],[3,2,3],[1,3,3],[2,3,3],[3,3,3],[1,4,3],[2,4,3],[3,4,3],[1,5,3],[2,5,3],[3,5,3],
  [2,6,3],[3,6,3],[2,7,3],[3,7,3],[2,8,3],[3,8,3],[2,9,3],[3,9,3],[2,10,3],[3,10,3],[2,11,3],[3,11,3],[2,12,3],[3,12,3]],
  blocks:[["キッチン",1,8,5]]};
function numberSeats(tables){let k=0;return tables.map((t,i)=>({i,c:t[0],r:t[1],n:t[2]})).sort((a,b)=>a.r-b.r||a.c-b.c)
  .map(t=>({...t,seats:Array.from({length:t.n},()=>String(++k))})).sort((a,b)=>a.i-b.i);}
const TB=numberSeats(ROOM.tables);
const SEATS=TB.flatMap(t=>t.seats).sort((a,b)=>a-b);
const ORD=Object.fromEntries(SEATS.map((n,i)=>[n,i]));
const MENU=[["永遠の愛",400],["誰もが憧れるベリーソーダ",300],["自由を求めるクリームソーダ",400],["革命の歌 明日への希望を掲げて",400],
  ["コーヒー HOT",300],["コーヒー ICE",300],["紅茶 HOT",300],["紅茶 ICE",300],["ココア",300],["カフェラテ",300],
  ["オレンジジュース",300],["ホットサンド",500],["カレーライス",600],["マフィン",400],["クッキー",300]];
const PAMPH=500,PAMPH2=800;
// パンフレット：2冊ごとに800円、余った1冊は500円（1冊500・2冊800・3冊1,300・4冊1,600）
const pamphAmt=n=>Math.floor(n/2)*PAMPH2+(n%2)*PAMPH;
const DISCS=[["なし",0],["部員 −100円",100],["お詫び −300円",300],["無料",Infinity]];
const TABS=[["hist","履歴"],["sales","売上"],["close","締め"],["soldout","売り切れ"],["set","設定"]];
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const yen=v=>v.toLocaleString('ja-JP');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hhmm=d=>d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
const num=v=>{const n=parseInt(String(v).normalize('NFKC').replace(/[^\d]/g,''),10);return isNaN(n)?0:n;};

// ---- 状態。st＝データ（元に戻す＝写しを戻す）／ui＝画面の状態
let st, ui, toast=null, toastTimer=null, hintTimer=null;
const DATA=['S','sel','flags','H','nid','disc','pamph'];
function seed(){
  const r=rng(20241121),pick=n=>Math.floor(r()*n);
  st={S:{},sel:[],flags:{},H:[],nid:1,disc:0,pamph:0,soldOut:{},cash:{start:'',moves:[],counted:''},mv:{kind:'in',amt:'',memo:''}};
  const order=ROOM.tables.map((_,i)=>i).sort(()=>r()-.5),pOf={};
  order.forEach((ti,k)=>{pOf[ti]=k<14?.95:k<20?.55:.05;});
  TB.forEach((t,ti)=>{
    const fav=[pick(15),pick(15)];
    t.seats.forEach(n=>{
      const x=r();let s='empty',lines=[];
      if(x<pOf[ti]){s='unpaid';const k=1+pick(3);
        for(let i=0;i<k;i++){const m=r()<.6?fav[pick(2)]:pick(15);const f=lines.find(l=>l.m===m);if(f)f.q++;else lines.push({m,q:r()<.15?2:1});}
      }else if(r()<(pOf[ti]>=.5?.5:.1))s='seated';
      st.S[n]={st:s,lines:lines.map(l=>({id:st.nid++,...l}))};
    });
  });
  const now=Date.now();
  const mk=(min,n,ls,d,flag)=>{const L=ls.map(([m,q])=>({m,q}));return mkRec({id:st.nid++,time:hhmm(new Date(now-min*60000)),seats:[{n,lines:L}],di:d===300?2:0,pamph:0,flag,fs:flag?[n]:[]});};
  st.H=[mk(7,"40",[[4,1],[11,1]],0,false),mk(19,"18",[[12,1],[0,1]],0,true),mk(33,"27",[[1,2],[13,1]],300,false),mk(48,"55",[[5,1],[14,1]],0,false),mk(62,"4",[[2,1],[9,1],[12,1]],0,false)];
  ui={view:'pay',addSeat:null,addQ:{},moving:null,discOpen:false,modal:false,mtab:'hist',histFlag:false,openId:null,askId:null,hdiscId:null,resetAsk:false,setNote:false,hint:false};
}
const snap=()=>JSON.stringify(DATA.reduce((o,k)=>(o[k]=st[k],o),{}));
function setToast(msg,s){toast={msg,s};clearTimeout(toastTimer);toastTimer=setTimeout(()=>{toast=null;render();},4500);}
const linesSum=L=>L.reduce((s,l)=>s+MENU[l.m][1]*l.q,0);
const sub=n=>linesSum(st.S[n].lines);
const selList=()=>[...st.sel].sort((a,b)=>ORD[a]-ORD[b]);
const unpaidSeats=()=>SEATS.filter(n=>st.S[n].st==='unpaid');
const flagCount=()=>unpaidSeats().filter(n=>st.flags[n]).length;
const seatsSum=()=>st.sel.reduce((s,n)=>s+sub(n),0);
const discAmt=()=>Math.min(DISCS[st.disc][1],seatsSum());
const totalNow=()=>seatsSum()-discAmt()+pamphAmt(st.pamph);
const rKey=r=>JSON.stringify([r.seats.map(x=>[x.n,x.lines.map(l=>[l.m,l.q]).sort((a,b)=>a[0]-b[0])]),r.pamph,r.di]);
const rSum=r=>r.seats.reduce((s,x)=>s+linesSum(x.lines),0);
function rCalc(r){const s=rSum(r);r.disc=Math.min(DISCS[r.di][1],s);r.total=s-r.disc+pamphAmt(r.pamph);}
function mkRec(r){rCalc(r);r.o={k:rKey(r),t:r.total};return r;}
const edited=r=>rKey(r)!==r.o.k;
const salesTotal=()=>st.H.reduce((s,r)=>s+r.total,0);
function findLine(id){for(const n in st.S){const l=st.S[n].lines.find(x=>x.id===id);if(l)return l;}return null;}
function addLines(dst,src){src.forEach(l=>{const f=dst.find(x=>x.m===l.m);if(f)f.q+=l.q;else dst.push({id:st.nid++,m:l.m,q:l.q});});}
st=null;

// ---- 描画（作り直さず、変わった所だけ直す）
function morph(a,b){
  const ac=a.childNodes,bc=b.childNodes;
  for(let i=0;i<bc.length;i++){
    if(i>=ac.length){a.appendChild(bc[i].cloneNode(true));continue;}
    const x=ac[i],y=bc[i];
    if(x.nodeType!==y.nodeType||x.nodeName!==y.nodeName){x.replaceWith(y.cloneNode(true));continue;}
    if(x.nodeType===3){if(x.nodeValue!==y.nodeValue)x.nodeValue=y.nodeValue;continue;}
    for(const at of [...x.attributes])if(!y.hasAttribute(at.name))x.removeAttribute(at.name);
    for(const at of [...y.attributes])if(x.getAttribute(at.name)!==at.value)x.setAttribute(at.name,at.value);
    if(x.nodeName==='INPUT'&&document.activeElement!==x&&x.value!==y.getAttribute('value'))x.value=y.getAttribute('value')||'';
    morph(x,y);
  }
  while(a.childNodes.length>bc.length)a.removeChild(a.lastChild);
}
function seatBtn(n){
  const s=st.S[n],on=st.sel.includes(n);let cls=s.st+(on?' on':''),dis='';
  if(ui.moving){if(s.st==='empty')cls+=' tgt';else{cls+=' dim';dis='disabled';}}
  return `<button class="seat ${cls}" data-a="seat" data-v="${n}" ${dis}>${n}${s.st==='unpaid'&&st.flags[n]?'<i>⚑</i>':''}</button>`;
}
function mapPane(){
  const top=ui.moving?`<div class="mvbar"><span>移す先の空いている席を押してください</span><button data-a="movecancel">やめる</button></div>`
    :`<div class="edge"><span></span><b>前（ショー）</b><span>ドア</span></div>`;
  return `<section class="mapwrap"><div class="maptop">${top}</div><div id="map" data-sc="map">`
    +ROOM.blocks.map(([nm,c,r,sp])=>`<div class="kitchen" style="grid-column:${c};grid-row:${r} / span ${sp}">${nm}</div>`).join('')
    +TB.map(t=>`<div class="table" style="--c:${t.c};--r:${t.r}"><div class="seats">${t.seats.map(seatBtn).join('')}</div></div>`).join('')
    +`</div><div class="edge2"><span>ドア</span></div></section>`;
}
const stpH=(a,k,q)=>`<span class="stp"><button data-a="${a}" data-v="${k}:-1" ${q>0?'':'disabled'}>−</button><b class="q">${q}</b><button data-a="${a}" data-v="${k}:1">＋</button></span>`;
const stp=l=>`<span class="stp"><button data-a="q" data-v="${l.id}:-1" ${l.q>0?'':'disabled'}>−</button><b class="q">${l.q}</b><button data-a="q" data-v="${l.id}:1">＋</button></span>`;
function cardsHTML(){
  const lock=ui.moving?'disabled':'';
  return selList().map(n=>{
    const fl=st.flags[n];
    return `<div class="card" data-seat="${n}"><div class="hd"><span class="hn">席 ${n}</span>`
      +`<button data-a="addopen" data-v="${n}" ${lock}>足す</button><button data-a="moveopen" data-v="${n}" ${lock}>移す</button>`
      +`<button class="flg ${fl?'on':''}" data-a="flag" data-v="${n}">⚑</button><b class="amt">${yen(sub(n))}円</b></div>`
      +st.S[n].lines.map(l=>`<div class="line ${l.q?'':'z'}"><span class="nm">${MENU[l.m][0]}</span><span class="amt">${yen(MENU[l.m][1]*l.q)}</span>${stp(l)}</div>`).join('')+`</div>`;
  }).join('');
}
function addListHTML(){
  return MENU.map((m,i)=>{const so=st.soldOut[i],q=ui.addQ[i]||0;
    return `<div class="ar ${so?'so':''}"><span class="nm">${m[0]}${so?'<em>売り切れ</em>':''}</span><span class="p num">${m[1]}</span><span class="stp"><button data-a="aq" data-v="${i}:-1" ${so||!q?'disabled':''}>−</button><b>${q}</b><button data-a="aq" data-v="${i}:1" ${so?'disabled':''}>＋</button></span></div>`;}).join('');
}
function payPane(){
  const adding=ui.view==='add',n=ui.addSeat,sel=selList();
  const bar=adding?`<b>席 ${n} に足す</b><button data-a="vcancel">やめる</button>`
    :`<b class="${sel.length?'':'none'}">${sel.length?'席 '+sel.join('・'):'席を押してください'}</b><button data-a="clearsel" ${sel.length&&!ui.moving?'':'disabled'}>✕</button>`;
  const body=adding?addListHTML():(ui.hint?`<div class="hint">注文がありません</div>`:'')+cardsHTML();
  const any=Object.values(ui.addQ).some(q=>q>0);
  const canPay=(sel.length||st.pamph>0)&&!ui.moving;
  const lk=adding||ui.moving?'disabled':'';
  const tst=toast?`<div class="toast"><span>${toast.msg}</span><button data-a="undo">元に戻す</button></div>`:'';
  const dpop=ui.discOpen?`<div class="dpop">${DISCS.map(([t],i)=>`<button class="${st.disc===i?'on':''}" data-a="disc" data-v="${i}">${t}</button>`).join('')}</div>`:'';
  return `<section class="pay"><div class="selbar">${bar}</div><div class="body" data-sc="${adding?'add':'pay'}">${body}</div>`
    +`<div class="foot">${tst}<div class="drow"><span>値引き</span><button class="dbtn ${ui.discOpen?'on':''}" data-a="discopen" ${sel.length&&!lk?'':'disabled'}>${DISCS[st.disc][0]}</button>${dpop}</div>`
    +`<div class="pamph"><span class="pn">パンフレット <span class="num">${PAMPH}円</span><span class="num bulk"><i>・</i>2冊 ${PAMPH2}円</span></span><span class="stp"><button data-a="pq" data-v="-1" ${st.pamph>0&&!lk?'':'disabled'}>−</button><b>${st.pamph}</b><button data-a="pq" data-v="1" ${lk}>＋</button></span></div>`
    +`<div class="total"><span>合計</span><b id="total">${yen(totalNow())}円</b></div>`
    +(adding?`<button class="main" data-a="adddo" ${any?'':'disabled'}>足す</button>`:`<button class="main" data-a="pay" ${canPay?'':'disabled'}>会計済みにする</button>`)
    +`</div></section>`;
}
// ---- メニューの窓の中身
function histHTML(){
  const rs=st.H.filter(r=>!ui.histFlag||r.flag);
  const un=ui.histFlag?unpaidSeats().filter(n=>st.flags[n]):[];
  const tool=`<div class="wtool"><button class="${ui.histFlag?'on':''}" data-a="histflag">印つきだけ</button></div>`;
  const fcs=un.map(n=>`<div class="fcard"><b>席 ${n}</b><span>未会計</span></div>`).join('');
  const rows=rs.map(r=>{
    const o=ui.openId===r.id,multi=r.seats.length>1;
    const who=r.seats.length?'席 '+r.seats.map(x=>x.n).join('・')+(r.pamph?'・パンフレット':''):'パンフレット';
    let det='';
    if(o){
      const nm=x=>multi?'席'+x.n+' ':'';
      det=`<div class="hdet">`+r.seats.map((x,si)=>x.lines.map((l,li)=>`<div class="line ${l.q?'':'z'}"><span class="nm">${nm(x)}${MENU[l.m][0]}</span><span class="amt">${yen(MENU[l.m][1]*l.q)}</span>${stpH('hq',r.id+':'+si+':'+li,l.q)}</div>`).join('')).join('')
        +`<div class="line ${r.pamph?'':'z'}"><span class="nm">パンフレット</span><span class="amt">${yen(pamphAmt(r.pamph))}</span>${stpH('hp',r.id,r.pamph)}</div>`
        +`<div class="line hdsel"><span class="nm">値引き</span><span class="amt">${r.disc?'−'+yen(r.disc):''}</span><button class="dbtn2 ${ui.hdiscId===r.id?'on':''}" data-a="hdopen" data-v="${r.id}">${DISCS[r.di][0]}</button></div>`
        +(ui.hdiscId===r.id?`<div class="dopts hdsel">${DISCS.map(([t],i)=>`<button class="${r.di===i?'on':''}" data-a="hdisc" data-v="${r.id}:${i}">${t}</button>`).join('')}</div>`:'')
        +`<div class="line tot"><span>合計</span><span class="num">${yen(r.total)}円</span></div>`
        +(edited(r)?`<div class="orig">はじめ ${yen(r.o.t)}円</div>`:'')
        +(ui.askId===r.id?`<div class="line act"><span class="nm">取り消しますか</span><button class="danger" data-a="hcancel" data-v="${r.id}">はい</button><button data-a="hno">やめる</button></div>`
          :`<div class="line act"><button class="danger" data-a="hask" data-v="${r.id}">取り消す</button></div>`)+`</div>`;
    }
    return `<div class="hcard"><button class="hbtn ${o?'open':''}" data-a="hopen" data-v="${r.id}"><span class="ht">${r.time}</span><span class="hs">${who}</span>${edited(r)?'<span class="fix">直し済み</span>':''}<span class="hf">${r.flag?'⚑':''}</span><b class="ha num">${yen(r.total)}円</b></button>${det}</div>`;
  }).join('');
  return tool+fcs+rows+(!rs.length&&!un.length?`<div class="note">ありません</div>`:'');
}
function salesHTML(){
  const cnt={};st.H.forEach(r=>{r.seats.forEach(x=>x.lines.forEach(l=>{if(l.q>0)cnt[l.m]=(cnt[l.m]||0)+l.q;}));if(r.pamph)cnt.p=(cnt.p||0)+r.pamph;});
  const items=Object.entries(cnt).map(([k,q])=>[k==='p'?'パンフレット':MENU[k][0],q,k==='p'?99:+k]).sort((a,b)=>b[1]-a[1]||a[2]-b[2]);
  return `<div class="srow"><span>合計</span><b id="sTotal" class="num">${yen(salesTotal())}円</b></div>`
    +`<div class="srow"><span>会計の件数</span><b id="sCount">${st.H.length}件</b></div>`
    +`<div class="srow"><span>値引きの合計</span><b id="sDisc" class="num">${yen(st.H.reduce((s,r)=>s+r.disc,0))}円</b></div>`
    +`<div class="srow h"><span>品ごと</span></div>`
    +(items.length?items.map(([t,q])=>`<div class="srow it"><span>${t}</span><b>${q}</b></div>`).join(''):`<div class="note">まだありません</div>`);
}
function calc(){
  const c=st.cash,inn=c.moves.filter(m=>m.kind==='in').reduce((s,m)=>s+m.amt,0),out=c.moves.filter(m=>m.kind==='out').reduce((s,m)=>s+m.amt,0);
  const exp=num(c.start)+salesTotal()+inn-out,has=String(c.counted).trim()!=='';
  return {exp,has,diff:has?num(c.counted)-exp:0};
}
function closeHTML(){
  const c=st.cash,mv=st.mv,k=calc();
  return `<div class="fld"><span class="l">はじめの釣り銭</span><input data-f="start" inputmode="numeric" value="${esc(c.start)}" placeholder="0">円</div>`
    +`<div class="blk"><div class="bh">入金・出金</div>`
    +c.moves.map(m=>`<div class="line"><span class="nm">${m.kind==='in'?'入金':'出金'}　${esc(m.memo)}</span><span class="amt num">${m.kind==='in'?'+':'−'}${yen(m.amt)}</span></div>`).join('')
    +`<div class="mvrow"><button class="${mv.kind==='in'?'on':''}" data-a="mvkind" data-v="in">入金</button><button class="${mv.kind==='out'?'on':''}" data-a="mvkind" data-v="out">出金</button>`
    +`<input data-f="mvAmt" inputmode="numeric" value="${esc(mv.amt)}" placeholder="金額"><input class="memo" data-f="mvMemo" value="${esc(mv.memo)}" placeholder="メモ"><button data-a="mvadd">記録</button></div></div>`
    +`<div class="fld"><span class="l">数えた現金</span><input data-f="counted" inputmode="numeric" value="${esc(c.counted)}" placeholder="0">円</div>`
    +`<div class="srow"><span>あるはずの現金</span><b id="cExp" class="num">${yen(k.exp)}円</b></div>`
    +`<div class="srow"><span>差</span>`+(!k.has?`<b id="cDiff">—</b>`:k.diff===0?`<b id="cDiff">合っています</b>`:`<b id="cDiff" class="num warn">${k.diff>0?'+':'−'}${yen(Math.abs(k.diff))}円</b>`)+`</div>`;
}
function soldoutHTML(){
  return MENU.map((m,i)=>{const o=st.soldOut[i];
    return `<div class="srow ${o?'so':''}"><span class="s">${m[0]}</span><span class="tag">${o?'売り切れ':''}</span><button class="sob ${o?'on':''}" data-a="so" data-v="${i}">${o?'戻す':'売り切れ'}</button></div>`;}).join('');
}
function setHTML(){
  return `<button class="setbtn" data-a="setting">設定の表を開く</button>`+(ui.setNote?`<div class="note">本番では、メニューや値段を直す表が開きます</div>`:'');
}
function contentHTML(t){return {hist:histHTML,sales:salesHTML,close:closeHTML,soldout:soldoutHTML,set:setHTML}[t]();}
function modalHTML(){
  if(!ui.modal)return '';
  return `<div class="ov"><div class="win"><div class="whead"><b>メニュー</b><button data-a="mclose">✕</button></div><div class="wbody"><div class="wlist">`
    +TABS.map(([k,t])=>`<button class="${ui.mtab===k?'on':''}" data-a="mtab" data-v="${k}">${t}</button>`).join('')
    +`</div><div class="wcont" data-sc="m-${ui.mtab}">${contentHTML(ui.mtab)}</div></div></div></div>`;
}
function headerHTML(){
  const u=unpaidSeats(),f=flagCount();
  const band=ui.resetAsk?`<div class="cband"><span>未会計 ${u.length}席 ${yen(u.reduce((s,n)=>s+sub(n),0))}円</span><button class="danger" data-a="resetgo">空に戻す</button><button data-a="resetno">やめる</button></div>`:'';
  return `<div class="hwrap"><div class="hdr"><span class="t">レジ</span><span class="sum">未会計 ${u.length}席 ${yen(u.reduce((s,n)=>s+sub(n),0))}円</span>`
    +`<button class="fbtn ${f?'':'off'}" data-a="flagsopen" ${f?'':'disabled'}>⚑ ${f}</button><span class="sp"></span>`
    +`<button data-a="resetask">全席を空に戻す</button><button data-a="mopen">メニュー</button></div>${band}</div>`;
}
function render(){
  const root=document.getElementById('root'),t=document.createElement('div');
  t.innerHTML=headerHTML()+`<main>${mapPane()}${payPane()}</main>`+modalHTML();
  morph(root,t);
}

// ---- 操作
const A={
  seat(n){
    const s=st.S[n];
    if(ui.moving){
      if(s.st!=='empty')return;const from=ui.moving,sn=snap();
      st.S[n]={st:'unpaid',lines:st.S[from].lines};st.S[from]={st:'empty',lines:[]};
      st.sel=st.sel.map(x=>x===from?n:x);if(st.flags[from]){delete st.flags[from];st.flags[n]=true;}
      ui.moving=null;setToast(`席 ${from} → ${n} に移しました`,sn);return;
    }
    if(s.st!=='unpaid'){ui.hint=true;clearTimeout(hintTimer);hintTimer=setTimeout(()=>{ui.hint=false;render();},2500);return;}
    ui.hint=false;st.disc=0;ui.discOpen=false;
    st.sel=st.sel.includes(n)?st.sel.filter(x=>x!==n):[...st.sel,n];
  },
  clearsel(){st.sel=[];st.disc=0;ui.discOpen=false;ui.hint=false;},
  pq(v){st.pamph=Math.max(0,st.pamph+(+v));},
  discopen(){ui.discOpen=!ui.discOpen;},
  disc(v){st.disc=+v;ui.discOpen=false;},
  q(v){const [id,d]=v.split(':').map(Number),l=findLine(id);if(!l)return;l.q=Math.max(0,l.q+d);},
  flag(n){if(st.flags[n])delete st.flags[n];else st.flags[n]=true;},
  pay(){
    if(!(st.sel.length||st.pamph>0)||ui.moving||ui.view!=='pay')return;
    const sn=snap(),seats=selList(),fs=seats.filter(n=>st.flags[n]);
    const rec=mkRec({id:st.nid++,time:hhmm(new Date()),
      seats:seats.map(n=>({n,lines:st.S[n].lines.map(l=>({m:l.m,q:l.q}))})),
      di:seats.length?st.disc:0,pamph:st.pamph,flag:fs.length>0,fs});
    st.H.unshift(rec);
    seats.forEach(n=>{st.S[n]={st:'empty',lines:[]};delete st.flags[n];});
    const pn=st.pamph;st.sel=[];st.disc=0;st.pamph=0;ui.discOpen=false;ui.hint=false;
    setToast(seats.length?`席 ${seats.join('・')} を会計しました`:`パンフレット ${pn} を会計しました`,sn);
  },
  undo(){
    if(!toast)return;const d=JSON.parse(toast.s);DATA.forEach(k=>st[k]=d[k]);
    toast=null;clearTimeout(toastTimer);ui.view='pay';ui.addSeat=null;ui.addQ={};ui.moving=null;ui.discOpen=false;ui.openId=null;ui.askId=null;
  },
  addopen(n){ui.view='add';ui.addSeat=n;ui.addQ={};ui.discOpen=false;},
  aq(v){const [i,d]=v.split(':').map(Number);if(st.soldOut[i])return;ui.addQ[i]=Math.max(0,(ui.addQ[i]||0)+d);},
  adddo(){
    const n=ui.addSeat,sn=snap();
    Object.entries(ui.addQ).filter(([,q])=>q>0).forEach(([m,q])=>{const f=st.S[n].lines.find(l=>l.m===+m);if(f)f.q+=q;else st.S[n].lines.push({id:st.nid++,m:+m,q});});
    ui.view='pay';ui.addSeat=null;ui.addQ={};setToast('足しました',sn);
  },
  vcancel(){ui.view='pay';ui.addSeat=null;ui.addQ={};},
  moveopen(n){ui.moving=n;ui.discOpen=false;},
  movecancel(){ui.moving=null;},
  resetask(){ui.resetAsk=true;},
  resetno(){ui.resetAsk=false;},
  resetgo(){
    const sn=snap();SEATS.forEach(n=>{st.S[n]={st:'empty',lines:[]};});
    st.sel=[];st.flags={};st.disc=0;st.pamph=0;ui.resetAsk=false;ui.discOpen=false;ui.moving=null;ui.view='pay';
    setToast('全席を空に戻しました',sn);
  },
  // メニューの窓
  mopen(){ui.modal=true;ui.resetAsk=false;ui.discOpen=false;},
  mclose(){ui.modal=false;},
  mtab(v){ui.mtab=v;},
  flagsopen(){ui.modal=true;ui.mtab='hist';ui.histFlag=true;ui.openId=null;ui.askId=null;},
  histflag(){ui.histFlag=!ui.histFlag;},
  hopen(v){ui.openId=ui.openId===+v?null:+v;ui.askId=null;ui.hdiscId=null;},
  hask(v){ui.askId=+v;},
  hno(){ui.askId=null;},
  hq(v){const [id,si,li,d]=v.split(':').map(Number),r=st.H.find(x=>x.id===id);if(!r)return;const l=r.seats[si].lines[li];l.q=Math.max(0,l.q+d);rCalc(r);},
  hp(v){const [id,d]=v.split(':').map(Number),r=st.H.find(x=>x.id===id);if(!r)return;r.pamph=Math.max(0,r.pamph+d);rCalc(r);},
  hdopen(v){ui.hdiscId=ui.hdiscId===+v?null:+v;},
  hdisc(v){const [id,i]=v.split(':').map(Number),r=st.H.find(x=>x.id===id);if(!r)return;r.di=i;rCalc(r);ui.hdiscId=null;},
  hcancel(v){
    const r=st.H.find(x=>x.id===+v);if(!r)return;
    st.H.splice(st.H.indexOf(r),1);
    r.seats.forEach(x=>{
      const ls=x.lines.map(l=>({m:l.m,q:l.q}));
      if(st.S[x.n].st==='unpaid')addLines(st.S[x.n].lines,ls);
      else st.S[x.n]={st:'unpaid',lines:ls.map(l=>({id:st.nid++,m:l.m,q:l.q}))};
    });
    (r.fs||[]).forEach(n=>{st.flags[n]=true;});
    ui.openId=null;ui.askId=null;ui.hdiscId=null;
  },
  mvkind(v){st.mv.kind=v;},
  mvadd(){const a=num(st.mv.amt);if(!a)return;st.cash.moves.push({kind:st.mv.kind,amt:a,memo:st.mv.memo.trim()});st.mv.amt='';st.mv.memo='';},
  so(v){if(st.soldOut[v])delete st.soldOut[v];else st.soldOut[v]=true;},
  setting(){ui.setNote=true;},
};
document.addEventListener('click',e=>{
  if(ui.discOpen&&!e.target.closest('.drow'))ui.discOpen=false;
  if(ui.hdiscId!==null&&!e.target.closest('.hdsel'))ui.hdiscId=null;
  const ov=e.target.closest('.ov');
  if(ov&&e.target===ov){ui.modal=false;render();return;}
  const b=e.target.closest('[data-a]');
  if(!b||b.disabled){render();return;}
  A[b.dataset.a](b.dataset.v);render();
});
document.addEventListener('input',e=>{
  const f=e.target.dataset.f;if(!f)return;
  if(f==='start')st.cash.start=e.target.value;else if(f==='counted')st.cash.counted=e.target.value;
  else if(f==='mvAmt')st.mv.amt=e.target.value;else if(f==='mvMemo')st.mv.memo=e.target.value;
  render();
});
seed();render();
</script>
</body>
</html>
