<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>レジ操作の比べ見本</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#fff}
body{height:100dvh;display:flex;flex-direction:column;color:#222;font-size:14px;
  font-family:-apple-system,"Hiragino Sans","Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button{font:inherit;color:#222;cursor:pointer;margin:0;border:1px solid #ccc;background:#fff;border-radius:8px;padding:5px 10px;min-height:36px;line-height:1.2;white-space:nowrap}
button:active{opacity:.8}
button.on{background:#1d5fb8;border-color:#1d5fb8;color:#fff}
button:disabled{color:#bbb;border-color:#e3e3e3;background:#fff;cursor:default}
button.on:disabled{background:#bbb;border-color:#bbb;color:#fff}
button.danger{color:#d32f2f;border-color:#d32f2f}
button.danger:disabled{color:#bbb;border-color:#e3e3e3}
b{font-weight:700}
.num,.amt{font-variant-numeric:tabular-nums;white-space:nowrap}

/* 比べ見本の枠（章・案の切り替え。位置固定） */
#top{flex:none;border-bottom:1px solid #e3e3e3;padding:8px 12px 6px;display:flex;flex-direction:column;gap:6px}
#chap,#cases{display:flex;gap:6px}
#chap button{flex:1;max-width:200px;font-weight:700}
#cases{align-items:center;flex-wrap:wrap}
#cases button{width:64px;font-weight:700}
#desc{flex:1;min-width:0;font-size:13px;color:#555;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-left:6px}
#desc b{color:#222;margin-right:8px;font-size:14px}
#stage{flex:1;min-height:0;position:relative;overflow:hidden}

/* 見本の画面 */
.app{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff}
.hdr{flex:none;display:flex;align-items:center;gap:10px;padding:6px 12px;border-bottom:1px solid #e3e3e3;flex-wrap:wrap;min-height:46px}
.hdr .t{font-size:16px;font-weight:700}
.hdr .sum{color:#555;flex:1}
.tabs{display:flex;gap:6px}
.tabs button{font-weight:700;padding:5px 12px}
main{flex:1;min-height:0;display:grid;grid-template-columns:6fr 4fr}
.mapwrap{display:flex;flex-direction:column;min-height:0;min-width:0;padding:10px}
.maptop{flex:none;display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-bottom:8px;min-height:36px}
.maptop span{color:#555;flex:1}
#map{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:minmax(30px,1fr);gap:6px 16px;overflow:auto}
.kitchen{display:flex;align-items:center;justify-content:center;border:1px dashed #ccc;border-radius:8px;color:#bbb}
.table{grid-column:var(--c);grid-row:var(--r);display:flex;min-height:0}
.seats{flex:1;min-width:0;min-height:0;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px}
.seat{padding:0;min-height:0;min-width:0;font-weight:700;font-size:17px;border-radius:6px}
.seat.empty{color:#888;border-color:#ccc}
.seat.seated{color:#bbb;border-color:#e3e3e3;font-weight:400}
.seat.unpaid{background:#e8f0fb;border-color:#1d5fb8;color:#12407f}
.seat.unpaid.on{background:#1d5fb8;color:#fff}
.pay{position:relative;display:flex;flex-direction:column;min-height:0;min-width:0;border-left:1px solid #e3e3e3;background:#fff}
.strip{flex:none;display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid #e3e3e3;min-height:46px}
.strip b,.strip span{flex:1}
.vhead{flex:none;display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid #e3e3e3;min-height:46px}
.vhead b{flex:1;font-size:15px}
.body{flex:1;min-height:0;overflow-y:auto;padding:8px 12px}
.hint{text-align:center;color:#bbb;font-weight:700;font-size:16px;margin:36px 0}
.hint.s{margin:4px 0 8px;font-size:13px}
.card{margin-bottom:12px}
.hd{display:flex;align-items:center;gap:6px;min-height:40px;border-bottom:1px solid #e3e3e3}
.hd .hn{flex:1;font-weight:700;font-size:15px}
.hd .flg{width:36px;padding:0}
.hd .amt{min-width:68px;text-align:right}
.hd button{min-height:32px;padding:3px 9px}
.line{display:flex;align-items:center;gap:8px;min-height:42px;border-bottom:1px solid #f0f0f0}
.line .nm{flex:1;min-width:0}
.line .amt{width:62px;text-align:right}
.stp{display:inline-flex;align-items:center;gap:4px}
.stp button{width:34px;padding:0;min-height:32px;font-weight:700}
.stp b{min-width:22px;text-align:center}
.hbtn{display:flex;width:100%;align-items:center;gap:8px;min-height:42px;font-weight:700;font-size:15px;text-align:left}
.hbtn span{flex:1}
.hbtn.open,.rbtn.open{border-color:#1d5fb8}
.rbtn{display:flex;width:100%;align-items:center;gap:8px;min-height:42px;margin-top:4px;text-align:left}
.rbtn .nm{flex:1;min-width:0;white-space:normal}
.panel,.rpanel{display:flex;align-items:center;gap:6px;padding:6px 0 4px}
.panel button{flex:1}
.rpanel .sp{flex:1}
.selbar{flex:none;display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid #e3e3e3;min-height:46px}
.selbar b{flex:1;font-size:15px}
.selbar button{width:44px;padding:0}
.foot{position:relative;flex:none;padding:8px 12px 12px;border-top:1px solid #e3e3e3;background:#fff}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.total b{font-size:22px}
.main{width:100%;padding:13px;background:#1d5fb8;border-color:#1d5fb8;color:#fff;font-weight:700;font-size:15px}
.main:disabled{background:#bbb;border-color:#bbb;color:#fff}
.toast{position:absolute;left:12px;right:12px;bottom:100%;margin-bottom:6px;display:flex;align-items:center;gap:8px;background:#222;color:#fff;border-radius:8px;padding:6px 6px 6px 12px}
.toast span{flex:1}
.toast button{background:#fff;color:#1d5fb8;border-color:#fff;font-weight:700;min-height:32px}
.mv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 0}
.mv button{min-height:48px;font-weight:700;font-size:16px}
.ar{display:flex;align-items:center;gap:8px;min-height:42px;border-bottom:1px solid #f0f0f0}
.ar .nm{flex:1;min-width:0}
.ar .p{width:44px;text-align:right;color:#555}
.big{display:block;width:100%;min-height:52px;font-size:16px;font-weight:700;margin-bottom:8px;text-align:left;padding:0 14px}
.srow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #f0f0f0;min-height:40px}
.srow.h{color:#555;font-size:13px;border:0;padding-top:14px}
.srow .t{color:#555;width:56px}
.srow .s{flex:1}
.sob{width:84px;padding:3px 6px;min-height:32px;font-size:13px}
.note{color:#555;padding:12px 0}
/* 重ねて開く窓 */
.ov{position:absolute;inset:0;background:rgba(0,0,0,.28);display:flex;padding:28px 40px;z-index:5}
.win{flex:1;min-width:0;display:flex;flex-direction:column;background:#fff;border:1px solid #ccc;border-radius:12px;overflow:hidden}
.whead{flex:none;display:flex;align-items:center;gap:8px;padding:6px 8px 6px 14px;border-bottom:1px solid #e3e3e3}
.whead b{flex:1;font-size:16px}
.whead button{width:48px;padding:0}
.wbody{flex:1;min-height:0;display:grid;grid-template-columns:150px 1fr}
.wlist{padding:10px;display:flex;flex-direction:column;gap:8px;border-right:1px solid #e3e3e3}
.wlist button{font-weight:700;min-height:44px}
.wcont{min-height:0;overflow-y:auto;padding:8px 14px}

@media (max-width:700px){
  #top{padding:6px 10px 4px;gap:4px}
  #desc{flex:1 0 100%;margin:0}
  #cases button,#chap button{min-height:34px;padding:3px 4px}
  main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 46%}
  .pay{border-left:0;border-top:1px solid #e3e3e3}
  .mapwrap{padding:6px 8px}
  #map{grid-auto-rows:minmax(26px,1fr);gap:4px 10px}
  .seat{font-size:14px}
  .hdr{padding:4px 10px;gap:6px;min-height:40px}
  .hdr .sum{font-size:12px}
  .tabs{flex:1 0 100%;order:5}
  .tabs button{flex:1;padding:4px 2px;font-size:13px;min-height:34px}
  .ov{padding:10px}
  .wbody{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .wlist{flex-direction:row;border-right:0;border-bottom:1px solid #e3e3e3;padding:8px;gap:6px}
  .wlist button{flex:1;padding:3px 2px;font-size:13px;min-height:38px}
  .foot{padding:6px 12px 8px}
  .total{margin-bottom:4px}
  .total b{font-size:18px}
  .main{padding:11px}
  .hint{margin:16px 0}
}
.app.one .pay{flex:1;width:100%;max-width:560px;margin:0 auto;border-left:1px solid #e3e3e3;border-right:1px solid #e3e3e3;border-top:0}
</style>
</head>
<body>
<div id="top">
  <div id="chap"></div>
  <div id="cases"></div>
</div>
<div id="stage"></div>
<script>
// ---- 品・席の配置（mock/register.html から借用）
const ROOM={tables:[[1,1,3],[2,1,3],[3,1,3],[1,2,3],[2,2,3],[3,2,3],[1,3,3],[2,3,3],[3,3,3],[1,4,3],[2,4,3],[3,4,3],[1,5,3],[2,5,3],[3,5,3],
  [2,6,3],[3,6,3],[2,7,3],[3,7,3],[2,8,3],[3,8,3],[2,9,3],[3,9,3],[2,10,3],[3,10,3],[2,11,3],[3,11,3],[2,12,3],[3,12,3]],
  blocks:[["キッチン",1,8,5]]};
function numberSeats(tables){let k=0;return tables.map((t,i)=>({i,c:t[0],r:t[1],n:t[2]})).sort((a,b)=>a.r-b.r||a.c-b.c)
  .map(t=>({...t,seats:Array.from({length:t.n},()=>String(++k))})).sort((a,b)=>a.i-b.i);}
const TB=numberSeats(ROOM.tables);
const SEATS=TB.flatMap(t=>t.seats).sort((a,b)=>a-b);
const TOF={};TB.forEach((t,i)=>t.seats.forEach(n=>TOF[n]=i));
const MENU=[["永遠の愛",400],["誰もが憧れるベリーソーダ",300],["自由を求めるクリームソーダ",400],["革命の歌 明日への希望を掲げて",400],
  ["コーヒー HOT",300],["コーヒー ICE",300],["紅茶 HOT",300],["紅茶 ICE",300],["ココア",300],["カフェラテ",300],
  ["オレンジジュース",300],["ホットサンド",500],["カレーライス",600],["マフィン",400],["クッキー",300]];
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const CH=["直す","メニュー","席を選ぶ"];
const CASES={
 1:[["行にいつも出す","各行に − 数 ＋ をいつも表示"],["行を押すと開く","行を押すと数と取消が開く"],["今の形","直すを押す間だけ取消が出る"]],
 2:[["上にタブ","6項目が帯にいつも並ぶ"],["重ねて開く","メニューから窓が重なる"],["今の形","右の欄が一覧に変わり戻る"]],
 3:[["押した席を足していく","押すたび選択に加わる"],["押した席に切り替わる","1席だけ選択・まとめる可"],["机ごとに選ばれる","同じ机の未会計をまとめる"]]};
const yen=v=>v.toLocaleString('ja-JP');
let ch=1,cs=1,st,toast=null,toastTimer=null,hint=false,hintTimer=null,keep={};

// ---- 状態（JSONで丸ごと写せる形。元に戻す＝写しを戻す）
function newSt(){return {S:{},sel:[],flags:{},open:null,edit:false,view:null,addQ:{},nid:1,soldOut:{},tab:'pay',modal:false,mtab:'hist',merge:false};}
function L(m,q){return {id:st.nid++,m,q};}
function initSt(){
  st=newSt();
  if(ch===1){
    st.S['3']={st:'unpaid',lines:[L(0,1),L(4,2),L(11,1)]};
    st.S['4']={st:'unpaid',lines:[L(12,1),L(14,1)]};
    for(let n=5;n<=10;n++) st.S[String(n)]={st:'empty',lines:[]};
    st.sel=['3','4'];
  }else{
    const r=rng(20241121),pick=n=>Math.floor(r()*n);
    const order=ROOM.tables.map((_,i)=>i).sort(()=>r()-.5);
    const pOf={};order.forEach((ti,k)=>{pOf[ti]=k<14?.95:k<20?.55:.05;});
    TB.forEach((t,ti)=>{
      const fav=[pick(15),pick(15)];
      t.seats.forEach(n=>{
        const x=r();let s='empty',lines=[];
        if(x<pOf[ti]){s='unpaid';const k=1+pick(3);
          for(let i=0;i<k;i++){const m=r()<.6?fav[pick(2)]:pick(15);const f=lines.find(l=>l.m===m);if(f)f.q++;else lines.push({m,q:r()<.15?2:1});}
        }else if(r()<(pOf[ti]>=.5?.5:.1))s='seated';
        st.S[n]={st:s,lines:lines.map(l=>({...l,id:st.nid++}))};
      });
    });
    // 机ごと選択の比べ用：1〜3番は同じ机で3席とも未会計、4・5番は未会計で6番は注文なし
    ['1','2','3','4','5'].forEach(n=>{if(st.S[n].st!=='unpaid')st.S[n]={st:'unpaid',lines:[{id:st.nid++,m:(+n*3)%15,q:1}]};});
    st.S['6']={st:'seated',lines:[]};
    if(ch===2) st.sel=['1','4'];
  }
}
function reset(){initSt();toast=null;hint=false;keep={};clearTimeout(toastTimer);clearTimeout(hintTimer);}
const snap=()=>JSON.stringify(st);
function setToast(msg,s){toast={msg,s};clearTimeout(toastTimer);toastTimer=setTimeout(()=>{toast=null;render();},4500);}
function clearHint(){hint=false;clearTimeout(hintTimer);}

const S_=n=>st.S[n];
const seatSub=n=>S_(n).lines.reduce((s,l)=>s+MENU[l.m][1]*l.q,0);
const selSorted=()=>[...st.sel].sort((a,b)=>a-b);
const selTotal=()=>st.sel.reduce((s,n)=>s+seatSub(n),0);
function findLine(id){for(const n in st.S){const i=st.S[n].lines.findIndex(l=>l.id===id);if(i>=0)return {n,i,l:st.S[n].lines[i]};}return null;}
function removeLine(f){const s=S_(f.n);s.lines.splice(f.i,1);
  if(!s.lines.length){s.st='seated';st.sel=st.sel.filter(x=>x!==f.n);}st.open=null;}

// ---- 描画
function seatBtn(n){
  const s=S_(n),on=st.sel.includes(n);
  const dis=ch===2&&s.st!=='unpaid';
  return `<button class="seat ${s.st} ${on?'on':''}" data-a="seat" data-v="${n}" ${dis?'disabled':''}>${n}</button>`;
}
function mapPane(){
  const top=ch===3&&cs===2?`<div class="maptop"><span></span><button class="${st.merge?'on':''}" data-a="merge">まとめる</button></div>`:'';
  return `<section class="mapwrap">${top}<div id="map" class="sc" data-sc="map">`
   +ROOM.blocks.map(([nm,c,r,sp])=>`<div class="kitchen" style="grid-column:${c};grid-row:${r} / span ${sp}">${nm}</div>`).join('')
   +TB.map(t=>`<div class="table" style="--c:${t.c};--r:${t.r}"><div class="seats">${t.seats.map(seatBtn).join('')}</div></div>`).join('')
   +`</div></section>`;
}
const stp=(l)=>`<span class="stp"><button data-a="q" data-v="${l.id}:-1">−</button><b class="q">${l.q}</b><button data-a="q" data-v="${l.id}:1">＋</button></span>`;
const addMoveBtns=n=>`<button data-a="addopen" data-v="${n}">足す</button><button data-a="moveopen" data-v="${n}">移す</button>`;
function cardsHTML(){
  return selSorted().map(n=>{
    const s=S_(n),sub=yen(seatSub(n))+'円',fl=st.flags[n];
    let head='',rows='';
    if(ch!==1){
      head=`<div class="hd"><span class="hn">席 ${n}</span><b class="amt">${sub}</b></div>`;
      rows=s.lines.map(l=>`<div class="line"><span class="nm">${MENU[l.m][0]} ×${l.q}</span><span class="amt">${yen(MENU[l.m][1]*l.q)}</span></div>`).join('');
    }else if(cs===1){
      head=`<div class="hd"><span class="hn">席 ${n}</span>${addMoveBtns(n)}<button class="flg ${fl?'on':''}" data-a="flag" data-v="${n}">⚑</button><b class="amt">${sub}</b></div>`;
      rows=s.lines.map(l=>`<div class="line"><span class="nm">${MENU[l.m][0]}</span><span class="amt">${yen(MENU[l.m][1]*l.q)}</span>${stp(l)}</div>`).join('');
    }else if(cs===2){
      const ho=st.open&&st.open.t==='head'&&st.open.v===n;
      head=`<button class="hbtn ${ho?'open':''}" data-a="headopen" data-v="${n}"><span>席 ${n}${fl?' ⚑':''}</span><b class="amt">${sub}</b></button>`
        +(ho?`<div class="panel"><button data-a="addopen" data-v="${n}">注文を足す</button><button data-a="moveopen" data-v="${n}">席を移す</button><button class="${fl?'on':''}" data-a="flag" data-v="${n}">印を付ける</button></div>`:'');
      rows=s.lines.map(l=>{const o=st.open&&st.open.t==='row'&&st.open.v===String(l.id);
        return `<button class="rbtn ${o?'open':''}" data-a="rowopen" data-v="${l.id}"><span class="nm">${MENU[l.m][0]} ×${l.q}</span><span class="amt">${yen(MENU[l.m][1]*l.q)}</span></button>`
          +(o?`<div class="rpanel">${stp(l)}<span class="sp"></span><button class="danger" data-a="cancel" data-v="${l.id}">取消</button></div>`:'');}).join('');
    }else{
      head=`<div class="hd"><span class="hn">席 ${n}${fl?' ⚑':''}</span>${st.edit?addMoveBtns(n):''}<button class="flg ${fl?'on':''}" data-a="flag" data-v="${n}">⚑</button><b class="amt">${sub}</b></div>`;
      rows=s.lines.map(l=>`<div class="line"><span class="nm">${MENU[l.m][0]} ×${l.q}</span><span class="amt">${yen(MENU[l.m][1]*l.q)}</span>${st.edit?`<button class="danger" data-a="cancel" data-v="${l.id}">取消</button>`:''}</div>`).join('');
    }
    return `<div class="card" data-seat="${n}">${head}${rows}</div>`;
  }).join('');
}
function addHTML(){
  const n=st.view.seat;
  return `<div class="vhead"><b>席 ${n} に足す</b><button data-a="vcancel">やめる</button></div><div class="body sc" data-sc="add">`
   +MENU.map((m,i)=>{const q=st.addQ[i]||0;
     return `<div class="ar"><span class="nm">${m[0]}</span><span class="p num">${m[1]}</span><span class="stp"><button data-a="aq" data-v="${i}:-1" ${q?'':'disabled'}>−</button><b>${q}</b><button data-a="aq" data-v="${i}:1">＋</button></span></div>`;}).join('')+`</div>`;
}
function moveHTML(){
  const n=st.view.seat;
  return `<div class="vhead"><b>席 ${n} を移す先</b><button data-a="vcancel">やめる</button></div><div class="body"><div class="mv">`
   +['5','6','7','8','9','10'].map(k=>`<button data-a="moveto" data-v="${k}" ${S_(k).st==='empty'?'':'disabled'}>${k}</button>`).join('')+`</div></div>`;
}
function footHTML(){
  const adding=st.view&&st.view.k==='add';
  const any=Object.values(st.addQ).some(q=>q>0);
  const t=toast?`<div class="toast"><span>${toast.msg}</span><button data-a="undo">元に戻す</button></div>`:'';
  return `<div class="foot">${t}<div class="total"><span>合計</span><b id="total">${yen(selTotal())}円</b></div>`
   +(adding?`<button class="main" data-a="adddo" ${any?'':'disabled'}>足す</button>`
          :`<button class="main" data-a="pay" ${st.sel.length&&!st.view?'':'disabled'}>会計済みにする</button>`)+`</div>`;
}
function payPane(){
  let top='',body='';
  if(st.view&&st.view.k==='add') body=addHTML();
  else if(st.view&&st.view.k==='move') body=moveHTML();
  else{
    if(ch===1) top=`<div class="strip"><b>会計</b>${cs===3?`<button class="${st.edit?'on':''}" data-a="edit" ${st.sel.length?'':'disabled'}>直す</button>`:''}</div>`;
    if(ch===3&&cs!==2) top=`<div class="selbar"><b>${st.sel.length?'席 '+selSorted().join('・'):'席 −'}</b><button data-a="clearsel" ${st.sel.length?'':'disabled'}>✕</button></div>`;
    const none=ch===1?'席がありません':'席を押してください';
    body=`<div class="body sc" data-sc="pay">`+(hint?`<div class="hint ${st.sel.length?'s':''}">注文がありません</div>`:'')
      +(st.sel.length?cardsHTML():(hint?'':`<div class="hint">${none}</div>`))+`</div>`;
  }
  return `<section class="pay">${top}${body}${footHTML()}</section>`;
}
// ---- 章2の中身（仮の表示）
function contentHTML(tab){
  if(tab==='hist') return [["14:52","席40",700],["14:41","席18",1000],["14:27","席27",1300],["14:12","席55",700],["13:58","席4",1700]]
    .map(r=>`<div class="srow"><span class="t">${r[0]}</span><span class="s">${r[1]}</span><b class="num">${yen(r[2])}円</b></div>`).join('');
  if(tab==='sales') return `<div class="srow"><span>今日の合計</span><b class="num">5,400円</b></div><div class="srow h"><span>品ごと</span></div>`
    +[["コーヒー HOT",4],["永遠の愛",2],["ホットサンド",2]].map(r=>`<div class="srow"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('');
  if(tab==='close') return `<div class="srow"><span>あるはずの現金</span><b class="num">8,400円</b></div><div class="srow"><span>数えた現金</span><b class="num">8,400円</b></div><div class="srow"><span>差</span><b class="num">0円</b></div>`;
  if(tab==='soldout') return MENU.map((m,i)=>{const o=st.soldOut[i];
    return `<div class="srow"><span class="s">${m[0]}</span><button class="sob ${o?'on':''}" data-a="so" data-v="${i}">売り切れ</button></div>`;}).join('');
  return `<div class="note">メニューや値段は設定の表で直します</div>`;
}
const TABNAME={pay:'会計',hist:'履歴',sales:'売上',close:'締め',soldout:'売り切れ',set:'設定'};
const SUBS=['hist','sales','close','soldout','set'];
function sidePane(){ // 章2：右の欄（案1・3で中身が入れ替わる）
  if(cs===1&&st.tab!=='pay') return `<section class="pay"><div class="vhead"><b>${TABNAME[st.tab]}</b></div><div class="body sc" data-sc="c-${st.tab}">${contentHTML(st.tab)}</div></section>`;
  if(cs===3&&st.view==='list') return `<section class="pay"><div class="vhead"><button data-a="back">戻る</button><b>メニュー</b></div><div class="body">`
    +SUBS.map(k=>`<button class="big" data-a="go" data-v="${k}">${TABNAME[k]}</button>`).join('')+`</div></section>`;
  if(cs===3&&st.view) return `<section class="pay"><div class="vhead"><button data-a="back">戻る</button><b>${TABNAME[st.view]}</b></div><div class="body sc" data-sc="c-${st.view}">${contentHTML(st.view)}</div></section>`;
  return payPane();
}
function modalHTML(){
  if(!st.modal) return '';
  return `<div class="ov"><div class="win"><div class="whead"><b>メニュー</b><button data-a="mclose">✕</button></div><div class="wbody"><div class="wlist">`
   +SUBS.map(k=>`<button class="${st.mtab===k?'on':''}" data-a="mtab" data-v="${k}">${TABNAME[k]}</button>`).join('')
   +`</div><div class="wcont sc" data-sc="m-${st.mtab}">${contentHTML(st.mtab)}</div></div></div></div>`;
}
function headerHTML(){
  const u=SEATS.filter(n=>S_(n).st==='unpaid');
  let right='';
  if(ch===2&&cs===1) right=`<div class="tabs">`+['pay',...SUBS].map(k=>`<button class="${st.tab===k?'on':''}" data-a="tab" data-v="${k}">${TABNAME[k]}</button>`).join('')+`</div>`;
  if(ch===2&&cs===2) right=`<button data-a="mopen">メニュー</button>`;
  if(ch===2&&cs===3) right=`<button class="${st.view?'on':''}" data-a="menu">メニュー</button>`;
  return `<div class="hdr"><span class="t">レジ</span><span class="sum">未会計 ${u.length}席</span>${right}</div>`;
}
function render(){
  document.querySelectorAll('#stage [data-sc]').forEach(e=>{keep[e.dataset.sc]=e.scrollTop;});
  document.getElementById('chap').innerHTML=CH.map((t,i)=>`<button class="${ch===i+1?'on':''}" data-a="chap" data-v="${i+1}">${i+1} ${t}</button>`).join('');
  const c=CASES[ch];
  document.getElementById('cases').innerHTML=c.map((_,i)=>`<button class="${cs===i+1?'on':''}" data-a="cs" data-v="${i+1}">案${i+1}</button>`).join('')
    +`<div id="desc"><b>${c[cs-1][0]}</b>${c[cs-1][1]}</div>`;
  document.getElementById('stage').innerHTML= ch===1
    ? `<div class="app one">${payPane()}</div>`
    : `<div class="app">${headerHTML()}<main>${mapPane()}${ch===2?sidePane():payPane()}</main>${ch===2&&cs===2?modalHTML():''}</div>`;
  document.querySelectorAll('#stage [data-sc]').forEach(e=>{if(keep[e.dataset.sc])e.scrollTop=keep[e.dataset.sc];});
}

// ---- 操作
function removeFromSel(n){st.sel=st.sel.filter(x=>x!==n);}
function toggleSel(n){st.sel.includes(n)?removeFromSel(n):st.sel.push(n);}
function cancelLine(id){const f=findLine(id);if(!f)return;const s=snap();removeLine(f);setToast('取り消しました',s);}
const A={
  chap(v){ch=+v;cs=1;reset();},
  cs(v){cs=+v;reset();},
  seat(n){
    const s=S_(n);
    if(ch===2){ if(s.st!=='unpaid')return; toggleSel(n); st.tab='pay'; st.view=null; return; }
    if(s.st!=='unpaid'){ hint=true; clearTimeout(hintTimer); hintTimer=setTimeout(()=>{hint=false;render();},2500); return; }
    clearHint();
    if(cs===1) toggleSel(n);
    else if(cs===2){ if(st.merge) toggleSel(n); else st.sel=(st.sel.length===1&&st.sel[0]===n)?[]:[n]; }
    else{ if(st.sel.includes(n)) removeFromSel(n);
      else TB[TOF[n]].seats.forEach(k=>{ if(S_(k).st==='unpaid'&&!st.sel.includes(k)) st.sel.push(k); }); }
  },
  merge(){st.merge=!st.merge;},
  clearsel(){st.sel=[];clearHint();},
  pay(){
    if(!st.sel.length)return; const s=snap(), seats=selSorted();
    seats.forEach(n=>{st.S[n]={st:'empty',lines:[]};delete st.flags[n];});
    st.sel=[];st.open=null;st.edit=false;st.view=null;st.merge=false;clearHint();
    setToast(`席 ${seats.join('・')} を会計しました`,s);
  },
  undo(){ if(!toast)return; st=JSON.parse(toast.s); toast=null; clearHint(); },
  q(v){const [id,d]=v.split(':').map(Number);const f=findLine(id);if(!f)return;
    const nq=f.l.q+d; if(nq<=0){cancelLine(id);return;}
    const s=snap();f.l.q=nq;setToast('数を直しました',s);},
  cancel(v){cancelLine(+v);},
  rowopen(v){st.open=(st.open&&st.open.t==='row'&&st.open.v===v)?null:{t:'row',v};},
  headopen(v){st.open=(st.open&&st.open.t==='head'&&st.open.v===v)?null:{t:'head',v};},
  edit(){st.edit=!st.edit;},
  flag(n){const s=snap();const on=!st.flags[n];if(on)st.flags[n]=true;else delete st.flags[n];setToast(on?'印を付けました':'印を外しました',s);},
  addopen(n){st.view={k:'add',seat:n};st.addQ={};st.open=null;},
  aq(v){const [i,d]=v.split(':').map(Number);st.addQ[i]=Math.max(0,(st.addQ[i]||0)+d);},
  adddo(){const n=st.view.seat;const s=snap();
    Object.entries(st.addQ).filter(([,q])=>q>0).forEach(([m,q])=>{const f=S_(n).lines.find(l=>l.m===+m);if(f)f.q+=q;else S_(n).lines.push({id:st.nid++,m:+m,q});});
    st.addQ={};st.view=null;setToast(`席 ${n} に足しました`,s);},
  moveopen(n){st.view={k:'move',seat:n};st.open=null;},
  moveto(k){const from=st.view.seat;if(S_(k).st!=='empty')return;const s=snap();
    st.S[k]={st:'unpaid',lines:S_(from).lines};st.S[from]={st:'empty',lines:[]};
    st.sel=st.sel.map(x=>x===from?k:x);if(st.flags[from]){delete st.flags[from];st.flags[k]=true;}
    st.view=null;st.open=null;setToast(`席 ${from} を ${k} に移しました`,s);},
  vcancel(){st.view=null;},
  // 章2
  tab(v){st.tab=v;},
  mopen(){st.modal=true;st.mtab='hist';},
  mclose(){st.modal=false;},
  mtab(v){st.mtab=v;},
  menu(){st.view='list';},
  go(v){st.view=v;},
  back(){st.view=st.view==='list'?null:'list';},
  so(v){if(st.soldOut[v])delete st.soldOut[v];else st.soldOut[v]=true;},
};
document.addEventListener('click',e=>{
  const ov=e.target.closest('.ov');
  if(ov&&e.target===ov){A.mclose();render();return;}
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  A[b.dataset.a](b.dataset.v);render();
});
reset();render();
</script>
</body>
