<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ウェイター（見本）</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#fff}
body{height:100dvh;display:flex;flex-direction:column;color:#222;font-size:14px;
  font-family:-apple-system,"Hiragino Sans","Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
#root{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
[hidden]{display:none!important}
button{font:inherit;color:#222;cursor:pointer;margin:0;border:1px solid #ccc;background:#fff;border-radius:8px;padding:5px 10px;min-height:36px;line-height:1.2;white-space:nowrap}
button:active{opacity:.8}
button.on{background:#1d5fb8;border-color:#1d5fb8;color:#fff}
button:disabled{color:#bbb;border-color:#e3e3e3;background:#fff;cursor:default}
button.on:disabled{background:#bbb;border-color:#bbb;color:#fff}
button.danger{color:#d32f2f;border-color:#d32f2f}
button.danger:disabled{color:#bbb;border-color:#e3e3e3}
b{font-weight:700}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}

/* 上の帯 */
.hwrap{position:relative;flex:none;z-index:6}
.hdr{display:flex;align-items:center;gap:12px;padding:6px 12px;border-bottom:1px solid #e3e3e3;min-height:46px;background:#fff}
.hdr .t{font-size:16px;font-weight:700}
.hdr .cnt{color:#1d5fb8;font-size:16px;white-space:nowrap}
.hdr .sp{flex:1}
.hdr .chip{color:#d32f2f;border:1px solid #d32f2f;border-radius:8px;padding:4px 10px;font-weight:700;white-space:nowrap}
.hdr .chip.off{visibility:hidden}

main{flex:1;min-height:0;display:grid;grid-template-columns:6fr 4fr}
.mapwrap{display:flex;flex-direction:column;min-height:0;min-width:0;padding:10px}
.maptop{flex:none;display:flex;align-items:center;gap:8px;margin-bottom:6px;height:38px}
.maptop .edge{flex:1;display:flex;justify-content:space-between;font-size:11px;color:#888}
.maptop .edge b{color:#555}
.maptop .mvbar{flex:1;display:flex;align-items:center;gap:8px;height:100%;padding:0 6px 0 12px;border:1px solid #1d5fb8;background:#e8f0fb;border-radius:8px;color:#12407f;font-weight:700}
.maptop .mvbar span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.maptop .mvbar button{min-height:30px}
.edge2{flex:none;display:flex;justify-content:flex-end;font-size:11px;color:#888;height:16px;line-height:16px}
#map{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:minmax(40px,1fr);gap:6px 16px;overflow:auto;padding:4px}
.kitchen{display:flex;align-items:center;justify-content:center;border:1px dashed #ccc;border-radius:8px;color:#bbb}
.table{grid-column:var(--c);grid-row:var(--r);display:flex;min-height:0}
.seats{flex:1;min-width:0;min-height:0;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px}
.seat{position:relative;padding:0;min-height:40px;min-width:34px;font-weight:700;font-size:17px;border-radius:6px}
.seat.empty{color:#888;border-color:#ccc;background:#fff;font-weight:400}
.seat.seated{background:#eee;border-color:#e0e0e0;color:#777;font-weight:400}
.seat.mkg{background:#e8f0fb;border-color:#b9d0f0;color:#12407f}
.seat.rdy{background:#1d5fb8;border-color:#1d5fb8;color:#fff}
.seat.call{border:2px solid #d32f2f;color:#d32f2f}
.seat.call.rdy{background:#fff}
.seat i{position:absolute;top:1px;right:3px;font-size:9px;font-style:normal;line-height:1.3;color:#1d5fb8}
.seat.pk{outline:3px solid #222;outline-offset:1px;z-index:1}
.seat.dim{opacity:.3}
.seat.tgt{border:2px solid #1d5fb8;color:#12407f;background:#fff}

.pay{position:relative;display:flex;flex-direction:column;min-height:0;min-width:0;border-left:1px solid #e3e3e3;background:#fff}
.selbar{flex:none;display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid #e3e3e3;min-height:46px}
.selbar b{flex:1;font-size:15px}
.selbar b em{font-style:normal;color:#d32f2f;font-size:12px;margin-left:8px}
.selbar button{min-width:44px;padding:0 10px}
.selbar .seg{min-width:72px;font-weight:700}
.selbar .smp{flex:1;color:#888;font-size:11px}
.seattop{position:relative;flex:none;padding:6px 12px 0}
.stat{display:flex;align-items:center;gap:10px;min-height:46px}
.stat button{min-width:96px;min-height:44px;font-weight:700;font-size:15px}
.stat .tot{flex:1;text-align:right;color:#888;font-size:12px}
.hd{display:flex;align-items:center;gap:6px;min-height:40px;border-bottom:1px solid #e3e3e3}
.hd .hn{flex:1;font-weight:700;font-size:15px}
.hd button{min-height:32px;padding:3px 9px}
.ask{position:absolute;left:12px;right:12px;top:100%;z-index:3;display:flex;align-items:center;gap:8px;padding:8px;background:#fff;border:1px solid #d32f2f;border-radius:10px}
.ask span{flex:1;color:#d32f2f;font-weight:700}
.body{flex:1;min-height:0;overflow-y:auto;padding:8px 12px}
.note{text-align:center;color:#bbb;font-weight:700;padding:16px 0}
.row{display:flex;align-items:center;gap:10px;min-height:58px;border:1px solid #e3e3e3;border-radius:10px;padding:6px 8px 6px 10px;margin-bottom:6px;cursor:pointer}
.row.pk{border:2px solid #1d5fb8;padding:5px 7px 5px 9px}
.row.new{background:#e8f0fb}
.row.call{border-color:#d32f2f}
.row.call.pk{border-color:#d32f2f}
.row.call .nm{color:#d32f2f;font-weight:700}
.sn{width:44px;flex:none;font-size:24px;font-weight:700;line-height:1;text-align:center}
.sn small{display:block;font-size:10px;font-weight:400;color:#888;margin-bottom:2px}
.row .nm{flex:1;min-width:0}
.mn{color:#555;white-space:nowrap}
.dl{min-width:72px;min-height:46px;font-weight:700;flex:none}
.gl{flex:1;min-width:0}
.gi{display:flex;align-items:center;gap:8px;min-height:30px}
.gi>span:first-child{flex:1;min-width:0}
.gi button{min-height:32px;padding:3px 9px}
.line{display:flex;align-items:center;gap:6px;min-height:46px;border-bottom:1px solid #f0f0f0}
.line .nm{flex:1;min-width:0}
.line .tg{width:74px;flex:none;text-align:center;font-size:11px;padding:3px 0;border:1px solid #ccc;border-radius:6px;color:#555}
.line .tg.t-rd{background:#1d5fb8;border-color:#1d5fb8;color:#fff}
.line .act{width:54px;flex:none}
.line .act button{width:100%;min-height:36px;padding:3px 0;font-weight:700}
.line.z .nm,.line.z .q{color:#bbb}
.line.z .tg{opacity:.4}
.stp{display:inline-flex;align-items:center;gap:2px;flex:none}
.stp button{width:30px;padding:0;min-height:32px;font-weight:700}
.stp b{min-width:20px;text-align:center}
.foot{flex:none;padding:8px 12px 12px;border-top:1px solid #e3e3e3;background:#fff}
.main{width:100%;padding:13px;background:#1d5fb8;border-color:#1d5fb8;color:#fff;font-weight:700;font-size:15px}
.main:disabled{background:#bbb;border-color:#bbb;color:#fff}
.toast{position:absolute;left:12px;right:12px;bottom:8px;display:flex;align-items:center;gap:8px;background:#222;color:#fff;border-radius:8px;padding:6px 6px 6px 12px;z-index:5}
.toast span{flex:1}
.toast button{background:#fff;color:#1d5fb8;border-color:#fff;font-weight:700;min-height:32px}
.ar{display:flex;align-items:center;gap:8px;min-height:42px;border-bottom:1px solid #f0f0f0}
.ar .nm{flex:1;min-width:0}
.ar .p{width:44px;text-align:right;color:#555}
.ar.so .nm,.ar.so .p{color:#bbb}
.ar em{font-style:normal;color:#d32f2f;font-size:12px;font-weight:700;margin-left:4px}

@media (max-width:700px){
  .hdr{padding:4px 8px;gap:8px;min-height:42px}
  .hdr .t{font-size:14px}
  .hdr .cnt{font-size:15px}
  main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 52%}
  .pay{border-left:0;border-top:1px solid #e3e3e3}
  .mapwrap{padding:6px 8px}
  .maptop{height:34px;margin-bottom:4px}
  #map{gap:4px 10px}
  .seat{font-size:15px}
  .selbar{min-height:42px;padding:3px 12px}
  .body{padding:6px 12px}
  .seattop{padding:2px 12px 0}
  .stat{min-height:46px}
  .foot{padding:6px 12px 8px}
  .main{padding:11px}
}
</style>
</head>
<body>
<div id="root"></div>
<script>
// ---- 部屋の配置（レジの見本と同じ）
const ROOM={tables:[[1,1,3],[2,1,3],[3,1,3],[1,2,3],[2,2,3],[3,2,3],[1,3,3],[2,3,3],[3,3,3],[1,4,3],[2,4,3],[3,4,3],[1,5,3],[2,5,3],[3,5,3],
  [2,6,3],[3,6,3],[2,7,3],[3,7,3],[2,8,3],[3,8,3],[2,9,3],[3,9,3],[2,10,3],[3,10,3],[2,11,3],[3,11,3],[2,12,3],[3,12,3]],
  blocks:[["キッチン",1,8,5]]};
function numberSeats(tables){let k=0;return tables.map((t,i)=>({i,c:t[0],r:t[1],n:t[2]})).sort((a,b)=>a.r-b.r||a.c-b.c)
  .map(t=>({...t,seats:Array.from({length:t.n},()=>String(++k))})).sort((a,b)=>a.i-b.i);}
const TB=numberSeats(ROOM.tables);
const SEATS=TB.flatMap(t=>t.seats).sort((a,b)=>a-b);
const MENU=[["永遠の愛",400],["誰もが憧れるベリーソーダ",300],["自由を求めるクリームソーダ",400],["革命の歌 明日への希望を掲げて",400],
  ["コーヒー HOT",300],["コーヒー ICE",300],["紅茶 HOT",300],["紅茶 ICE",300],["ココア",300],["カフェラテ",300],
  ["オレンジジュース",300],["ホットサンド",500],["カレーライス",600],["マフィン",400],["クッキー",300]];
const LABEL={mk:'作っています',rd:'できた',dl:'届けた'};
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const yen=v=>v.toLocaleString('ja-JP');
const MIN=60000;

// ---- 状態。st＝データ（元に戻す＝写しを戻す）／ui＝画面の状態
let st, ui, toast=null, toastTimer=null, nextTick=0, lastKey='';
const DATA=['S','calls','nid'];
function seed(){
  const r=rng(20241121),pick=n=>Math.floor(r()*n);
  st={S:{},calls:{},nid:1,soldOut:{12:true}};
  const order=ROOM.tables.map((_,i)=>i).sort(()=>r()-.5),pOf={};
  order.forEach((ti,k)=>{pOf[ti]=k<14?.95:k<20?.55:.05;});
  TB.forEach((t,ti)=>{
    const fav=[pick(15),pick(15)];
    t.seats.forEach(n=>{
      const x=r();let s='empty',lines=[];
      if(x<pOf[ti]){s='unpaid';const k=1+pick(3);
        for(let i=0;i<k;i++){const m=r()<.6?fav[pick(2)]:pick(15);const f=lines.find(l=>l.m===m);if(f)f.q++;else lines.push({m,q:r()<.15?2:1});}
      }else if(r()<(pOf[ti]>=.5?.5:.1))s='seated';
      st.S[n]={st:s,lines:lines.map(l=>({id:st.nid++,...l}))};
    });
  });
  // 状態と時刻を付ける
  const r2=rng(77),now=Date.now();
  const U=SEATS.filter(n=>st.S[n].st==='unpaid');
  const RP=[0,4,8,13,18].map(i=>U[i]),DBL=RP[2];let ri=0;
  U.forEach(n=>{
    const L=st.S[n].lines,k=RP.includes(n)?(n===DBL?2:1):0;
    while(L.length<k){let m=(L[0].m+3+L.length)%15;while(L.some(l=>l.m===m))m=(m+1)%15;L.push({id:st.nid++,m,q:1});}
    L.forEach((l,i)=>{
      if(i<k){l.s='rd';l.rt=now-(10-ri*1.3)*MIN;l.ot=l.rt-(3+r2()*3)*MIN;ri++;}
      else if(r2()<.5){l.s='dl';l.ot=now-(20+r2()*20)*MIN;l.rt=l.ot+4*MIN;}
      else{l.s='mk';l.ot=now-(1+r2()*13)*MIN;}
    });
  });
  st.calls[U[2]]=true;st.calls[U[10]]=true;
  ui={view:'list',mode:'item',sel:null,pick:null,addQ:{},moving:null,ask:false,flash:{}};
  nextTick=now+15000;
}
const snap=()=>JSON.stringify(DATA.reduce((o,k)=>(o[k]=st[k],o),{}));
function setToast(msg,sn,nav){toast={msg,s:sn,nav:nav||{view:ui.view,sel:ui.sel}};clearTimeout(toastTimer);toastTimer=setTimeout(()=>{toast=null;render();},4500);}
const nm=l=>MENU[l.m][0];
const total=n=>st.S[n].lines.reduce((s,l)=>s+MENU[l.m][1]*l.q,0);
const hasOrder=n=>st.S[n].lines.some(l=>l.q>0);
function readyLines(){
  const a=[];SEATS.forEach(n=>st.S[n].lines.forEach(l=>{if(l.s==='rd'&&l.q>0)a.push({n,l});}));
  return a.sort((x,y)=>x.l.rt-y.l.rt);
}
function readyGroups(){
  const m={};readyLines().forEach(o=>{(m[o.n]=m[o.n]||[]).push(o.l);});
  return Object.entries(m).map(([n,ls])=>({n,ls})).sort((a,b)=>a.ls[0].rt-b.ls[0].rt);
}
const callSeats=()=>SEATS.filter(n=>st.calls[n]);
const waitMin=l=>Math.max(0,Math.floor((Date.now()-l.rt)/MIN));
function pickSeat(){
  const p=ui.pick;if(!p)return null;
  if(p[0]==='i'){const id=+p.slice(1);for(const n of SEATS)if(st.S[n].lines.some(l=>l.id===id&&l.s==='rd'&&l.q>0))return n;return null;}
  const n=p.slice(1);if(p[0]==='s')return readyGroups().some(g=>g.n===n)?n:null;
  return st.calls[n]?n:null;
}
function findLine(id){for(const n in st.S){const l=st.S[n].lines.find(x=>x.id===id);if(l)return [n,l];}return [null,null];}

// ---- 描画（作り直さず、変わった所だけ直す）
function morph(a,b){
  const ac=a.childNodes,bc=b.childNodes;
  for(let i=0;i<bc.length;i++){
    if(i>=ac.length){a.appendChild(bc[i].cloneNode(true));continue;}
    const x=ac[i],y=bc[i];
    if(x.nodeType!==y.nodeType||x.nodeName!==y.nodeName){x.replaceWith(y.cloneNode(true));continue;}
    if(x.nodeType===3){if(x.nodeValue!==y.nodeValue)x.nodeValue=y.nodeValue;continue;}
    for(const at of [...x.attributes])if(!y.hasAttribute(at.name))x.removeAttribute(at.name);
    for(const at of [...y.attributes])if(x.getAttribute(at.name)!==at.value)x.setAttribute(at.name,at.value);
    morph(x,y);
  }
  while(a.childNodes.length>bc.length)a.removeChild(a.lastChild);
}
function seatBtn(n){
  const s=st.S[n],ls=s.lines;let cls;
  const rdy=ls.some(l=>l.s==='rd'&&l.q>0),mkg=ls.some(l=>l.s==='mk'&&l.q>0),call=st.calls[n];
  if(s.st==='empty'&&!ls.length)cls='empty';else if(rdy)cls='rdy';else if(mkg)cls='mkg';else cls='seated';
  if(call)cls+=' call';
  const hl=ui.view==='list'?pickSeat()===n:ui.sel===n;
  if(hl)cls+=' pk';
  let dis='';
  if(ui.moving){if(s.st==='empty'&&!ls.length)cls+=' tgt';else{cls+=' dim';dis='disabled';}}
  return `<button class="seat ${cls}" data-a="seat" data-v="${n}" ${dis}>${n}${call&&rdy?'<i>●</i>':''}</button>`;
}
function mapPane(){
  const top=ui.moving?`<div class="mvbar"><span>移す先の空いている席を押してください</span><button data-a="movecancel">やめる</button></div>`
    :`<div class="edge"><span></span><b>前（ショー）</b><span>ドア</span></div>`;
  return `<section class="mapwrap"><div class="maptop">${top}</div><div id="map">`
    +ROOM.blocks.map(([n,c,r,sp])=>`<div class="kitchen" style="grid-column:${c};grid-row:${r} / span ${sp}">${n}</div>`).join('')
    +TB.map(t=>`<div class="table" style="--c:${t.c};--r:${t.r}"><div class="seats">${t.seats.map(seatBtn).join('')}</div></div>`).join('')
    +`</div><div class="edge2"><span>ドア</span></div></section>`;
}
const fl=id=>ui.flash[id]>Date.now();
function listBody(){
  const calls=callSeats(),pk=ui.pick;
  let h=calls.map(n=>`<div class="row call ${pk==='c'+n?'pk':''}" data-a="pick" data-v="c${n}"><span class="sn"><small>席</small>${n}</span><span class="nm">呼び出し</span><button class="dl danger" data-a="went" data-v="${n}">行った</button></div>`).join('');
  if(ui.mode==='item'){
    const rl=readyLines();
    h+=rl.map(({n,l})=>`<div class="row ${pk==='i'+l.id?'pk':''} ${fl(l.id)?'new':''}" data-a="pick" data-v="i${l.id}"><span class="sn"><small>席</small>${n}</span><span class="nm">${nm(l)} ×${l.q}</span><span class="mn num">${waitMin(l)}分</span><button class="on dl" data-a="dl" data-v="${l.id}">届けた</button></div>`).join('');
    if(!rl.length)h+=`<div class="note">届ける物はありません</div>`;
  }else{
    const gs=readyGroups();
    h+=gs.map(g=>{const open=pk==='s'+g.n,nw=g.ls.some(l=>fl(l.id));
      return `<div class="row grp ${open?'pk':''} ${nw?'new':''}" data-a="pick" data-v="s${g.n}"><span class="sn"><small>席</small>${g.n}</span><div class="gl">`
        +g.ls.map(l=>`<div class="gi"><span>${nm(l)} ×${l.q}</span>${open?`<span class="mn num">${waitMin(l)}分</span><button data-a="dl" data-v="${l.id}">届けた</button>`:''}</div>`).join('')
        +`</div><button class="on dl" data-a="dlseat" data-v="${g.n}">届けた</button></div>`;}).join('');
    if(!gs.length)h+=`<div class="note">届ける物はありません</div>`;
  }
  return h;
}
const stp=(l,lock)=>`<span class="stp"><button data-a="q" data-v="${l.id}:-1" ${l.q>0&&!lock?'':'disabled'}>−</button><b class="q">${l.q}</b><button data-a="q" data-v="${l.id}:1" ${lock?'disabled':''}>＋</button></span>`;
function seatTop(){
  const n=ui.sel,s=st.S[n],lock=ui.moving?true:false,has=s.lines.length>0,emp=s.st==='empty'&&!has;
  return `<div class="seattop"><div class="stat"><button class="${emp?'':'on'}" data-a="sit" ${lock||has?'disabled':''}>着席</button><span class="tot num">合計 ${yen(total(n))}円</span></div>`
    +`<div class="hd"><span class="hn">注文</span><button data-a="addopen" ${lock?'disabled':''}>足す</button><button data-a="moveopen" ${emp||lock?'disabled':''}>移す</button><button class="danger" data-a="emptyseat" ${emp||lock?'disabled':''}>空に</button></div>`
    +(ui.ask&&!lock?`<div class="ask"><span>会計がまだです。空に戻しますか</span><button class="danger" data-a="emptygo">はい</button><button data-a="askno">やめる</button></div>`:'')+`</div>`;
}
function seatBody(){
  const n=ui.sel,s=st.S[n],lock=!!ui.moving;
  if(!s.lines.length)return `<div class="note">注文はありません</div>`;
  return s.lines.map(l=>`<div class="line ${l.q?'':'z'}"><span class="nm">${nm(l)}</span><span class="tg t-${l.s}">${LABEL[l.s]}</span>${stp(l,lock)}<span class="act">${l.s==='rd'&&l.q>0?`<button class="on" data-a="dl" data-v="${l.id}" ${lock?'disabled':''}>届けた</button>`:''}</span></div>`).join('');
}
function addBody(){
  return MENU.map((m,i)=>{const so=st.soldOut[i],q=ui.addQ[i]||0;
    return `<div class="ar ${so?'so':''}"><span class="nm">${m[0]}${so?'<em>売り切れ</em>':''}</span><span class="p num">${m[1]}</span><span class="stp"><button data-a="aq" data-v="${i}:-1" ${so||!q?'disabled':''}>−</button><b>${q}</b><button data-a="aq" data-v="${i}:1" ${so?'disabled':''}>＋</button></span></div>`;}).join('');
}
function payPane(){
  const v=ui.view,lock=!!ui.moving;let bar,top='',body,foot='';
  if(v==='list'){
    bar=`<button class="seg ${ui.mode==='item'?'on':''}" data-a="mode" data-v="item">品ごと</button><button class="seg ${ui.mode==='seat'?'on':''}" data-a="mode" data-v="seat">席ごと</button><span class="smp">見本用</span>`;
    body=listBody();
  }else if(v==='seat'){
    bar=`<b>席 ${ui.sel}${st.calls[ui.sel]?'<em>呼び出し中</em>':''}</b><button data-a="close" ${lock?'disabled':''}>✕</button>`;
    top=seatTop();body=seatBody();
  }else{
    const any=Object.values(ui.addQ).some(q=>q>0);
    bar=`<b>席 ${ui.sel} に足す</b><button data-a="vcancel">やめる</button>`;
    body=addBody();foot=`<div class="foot"><button class="main" data-a="adddo" ${any?'':'disabled'}>注文する</button></div>`;
  }
  const tst=toast?`<div class="toast"><span>${toast.msg}</span><button data-a="undo">元に戻す</button></div>`:'';
  return `<section class="pay"><div class="selbar">${bar}</div>${top}<div class="body">${body}</div>${foot}${tst}</section>`;
}
function headerHTML(){
  const nc=callSeats().length;
  return `<div class="hwrap"><div class="hdr"><span class="t">ウェイター</span><b class="cnt">届ける ${readyLines().length}</b><span class="sp"></span>`
    +`<span class="chip ${nc?'':'off'}">呼び出し ${nc}</span></div></div>`;
}
function render(){
  if(ui.pick&&!pickSeat())ui.pick=null;
  const root=document.getElementById('root'),t=document.createElement('div');
  t.innerHTML=headerHTML()+`<main>${mapPane()}${payPane()}</main>`;
  morph(root,t);
  const key=ui.view+':'+ui.sel+':'+ui.mode;
  if(key!==lastKey){lastKey=key;const b=root.querySelector('.body');if(b)b.scrollTop=0;}
}

// ---- 操作
function done(msg,sn,nav){setToast(msg,sn,nav);}
function doEmpty(n){
  const sn=snap(),nav={view:'seat',sel:n};
  st.S[n]={st:'empty',lines:[]};delete st.calls[n];
  ui.view='list';ui.sel=null;ui.ask=false;ui.pick=null;
  done(`席 ${n} を空にしました`,sn,nav);
}
const A={
  mode(v){ui.mode=v;ui.pick=null;},
  pick(v){ui.pick=ui.pick===v?null:v;},
  went(n){const sn=snap(),nav={view:'list',sel:null};delete st.calls[n];done(`席 ${n} に行きました`,sn,nav);},
  dl(id){
    id=+id;const [n,l]=findLine(id);if(!l||l.s!=='rd')return;
    const sn=snap(),nav={view:ui.view,sel:ui.sel};l.s='dl';
    done(`席 ${n} ${nm(l)} を届けました`,sn,nav);
  },
  dlseat(n){
    const ls=st.S[n].lines.filter(l=>l.s==='rd'&&l.q>0);if(!ls.length)return;
    const sn=snap(),nav={view:ui.view,sel:ui.sel};ls.forEach(l=>{l.s='dl';});
    done(ls.length>1?`席 ${n} の ${ls.length}品 を届けました`:`席 ${n} ${nm(ls[0])} を届けました`,sn,nav);
  },
  seat(n){
    if(ui.moving){
      const s=st.S[n];if(s.st!=='empty'||s.lines.length)return;
      const from=ui.moving,sn=snap(),nav={view:'seat',sel:from};
      st.S[n]=st.S[from];st.S[from]={st:'empty',lines:[]};
      if(st.calls[from]){delete st.calls[from];st.calls[n]=true;}
      ui.moving=null;ui.sel=n;ui.view='seat';
      done(`席 ${from} → ${n} に移しました`,sn,nav);return;
    }
    if(ui.view!=='list'&&ui.sel===n){ui.view='list';ui.sel=null;}
    else{ui.view='seat';ui.sel=n;}
    ui.ask=false;ui.addQ={};ui.pick=null;
  },
  close(){ui.view='list';ui.sel=null;ui.ask=false;},
  sit(){const s=st.S[ui.sel];if(s.lines.length)return;s.st=s.st==='empty'?'seated':'empty';},
  q(v){const [id,d]=v.split(':').map(Number),[,l]=findLine(id);if(!l)return;l.q=Math.max(0,l.q+d);},
  addopen(){ui.view='add';ui.addQ={};ui.ask=false;},
  aq(v){const [i,d]=v.split(':').map(Number);if(st.soldOut[i])return;ui.addQ[i]=Math.max(0,(ui.addQ[i]||0)+d);},
  adddo(){
    const n=ui.sel,sn=snap(),nav={view:'seat',sel:n},s=st.S[n],now=Date.now();let c=0;
    Object.entries(ui.addQ).filter(([,q])=>q>0).forEach(([m,q])=>{
      const f=s.lines.find(l=>l.m===+m&&l.s==='mk');c++;
      if(f)f.q+=q;else s.lines.push({id:st.nid++,m:+m,q,s:'mk',ot:now});});
    if(!c)return;
    s.st='unpaid';ui.view='seat';ui.addQ={};
    done('注文を入れました',sn,nav);
  },
  vcancel(){ui.view='seat';ui.addQ={};},
  moveopen(){ui.moving=ui.sel;ui.ask=false;},
  movecancel(){ui.moving=null;},
  emptyseat(){if(hasOrder(ui.sel))ui.ask=true;else doEmpty(ui.sel);},
  emptygo(){doEmpty(ui.sel);},
  askno(){ui.ask=false;},
  undo(){
    if(!toast)return;const d=JSON.parse(toast.s),nav=toast.nav;DATA.forEach(k=>st[k]=d[k]);
    toast=null;clearTimeout(toastTimer);
    ui.view=nav.view;ui.sel=nav.sel;ui.pick=null;ui.addQ={};ui.moving=null;ui.ask=false;
  },
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');
  if(!b||b.disabled){render();return;}
  A[b.dataset.a](b.dataset.v);render();
});

// ---- 見本用：15秒ごとに「作っています」の品が1つ「できた」に変わる
function tick(){
  const c=[];SEATS.forEach(n=>st.S[n].lines.forEach(l=>{if(l.s==='mk'&&l.q>0)c.push(l);}));
  if(!c.length)return;
  c.sort((a,b)=>a.ot-b.ot);const l=c[0];l.s='rd';l.rt=Date.now();
  ui.flash[l.id]=Date.now()+1800;setTimeout(render,1900);
}
let lastMinRender=0;
setInterval(()=>{
  const now=Date.now();
  if(!toast&&now>=nextTick){tick();nextTick=now+15000;render();lastMinRender=now;}
  else if(now-lastMinRender>10000){lastMinRender=now;render();}
},500);
seed();render();
</script>
</body>
